tion migrate(){data.settings??={coinRate:10,xpCap:500,backdate:7};data.categories??=[{name:'Home',emoji:'🏠',frequency:'daily'},{name:'Wellness',emoji:'🌿',frequency:'daily'},{name:'Together',emoji:'💖',frequency:'monthly'}];data.ledger??=[];data.champions??=[];data.achievements??=[];data.settings.dailyBonusXP??=50;data.settings.dailyBonusCoins??=25;data.settings.weeklyBonusXP??=125;data.settings.monthlyBonusXP??=400;data.tasks.forEach(t=>{t.frequency??=(t.repeat?'daily':'once');t.maxPerPeriod??=1});data.quests.forEach(q=>{q.maxPerDay??=1;q.completedCount??=(q.status==='approved'?1:0);q.awarded??=(q.status==='approved');q.history??=[]});data.purchases.forEach(p=>{if(p.status==='used')p.status='fulfilled';p.history??=[]});if(!data.rewards.some(r=>r.name==='Dinner at Olive Garden'))data.rewards.push({id:uid(),name:'Dinner at Olive Garden',emoji:'🍝',price:1000,provider:'matthew',description:'Dinner at Olive Garden, subject to provider approval and scheduling.'});}migrate();save();let page='home',filter='All',modal='',toastTimer;const me=()=>data.players.find(p=>p.id===data.current);const other=()=>data.players.find(p=>p.id!==data.current);const totalXp=p=>p.xp;const level=p=>Math.floor(Math.sqrt(p.xp/100))+1;const levelBase=n=>100*(n-1)**2;const levelNext=p=>levelBase(level(p)+1);const levelPercent=p=>Math.max(0,Math.min(100,100*(p.xp-levelBase(level(p)))/(levelNext(p)-levelBase(level(p)))));const event=(type,detail)=>data.events.unshift({id:uid(),type,detail,actor:me().name,at:new Date().toISOString()});const notify=s=>{document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3000)};const isAdmin=()=>data.current==='matthew';
const datePeriod=(date,frequency)=>{let d=new Date(date+'T12:00:00');if(frequency==='daily')return date;if(frequency==='weekly'){const offset=d.getDay();d.setDate(d.getDate()-offset);return localDate(d)}if(frequency==='monthly')return date.slice(0,7);if(frequency==='quarterly')return date.slice(0,4)+'-Q'+(Math.floor((d.getMonth())/3)+1);if(frequency==='semiannual')return date.slice(0,4)+'-H'+(d.getMonth()<6?'1':'2');if(frequency==='annual')return date.slice(0,4);return 'lifetime'};
const countTask=(t,player=data.current,date=today())=>data.logs.filter(l=>l.taskId===t.id&&l.player===player&&!l.undone&&datePeriod(l.date,t.frequency||'daily')===datePeriod(date,t.frequency||'daily')).length;
const maxTask=t=>Math.max(1,Number(t.maxPerPeriod||1));
const taskAvailable=t=>{let d=new Date(),days=t.days||[];return (!days.length||days.includes(d.getDay()))&&(!t.startHour||d.getHours()>=Number(t.startHour))&&(!t.endHour||d.getHours()<Number(t.endHour))};
const rankName=l=>l>=100?'Mythic':l>=75?'Legend':l>=50?'Guardian':l>=35?'Champion':l>=20?'Knight':l>=10?'Squire':l>=5?'Adventurer':'Wanderer';
function transaction(player,kind,amount,source,detail){data.ledger.unshift({id:uid(),player,kind,amount,source,detail,at:new Date().toISOString()})}
function credit(playerId,xp,source,detail){let p=data.players.find(p=>p.id===playerId);if(!p||!Number.isFinite(xp)||xp<=0)return;let old=p.xp,oldLevel=level(p);p.xp+=xp;let gold=Math.floor(p.xp/data.settings.coinRate)-Math.floor(old/data.settings.coinRate);p.coins+=gold;transaction(playerId,'xp',xp,source,detail);if(gold)transaction(playerId,'gold',gold,source,detail);if(level(p)>oldLevel)notify('✦ Level up! '+p.name+' is now '+rankName(level(p))+' (Level '+level(p)+')');checkAchievements(playerId)}
function debitXP(playerId,xp,source){let p=data.players.find(p=>p.id===playerId);if(!p)return;let old=p.xp;p.xp=Math.max(0,p.xp-xp);let gold=Math.floor(old/data.settings.coinRate)-Math.floor(p.xp/data.settings.coinRate);p.coins-=gold;transaction(playerId,'xp',-xp,source,'Undo completion');if(gold)transaction(playerId,'gold',-gold,source,'Coin correction')}
const achievementRules=[['first','🌟','First Steps',p=>p.xp>0],['five','⚔️','Five Victories',p=>data.logs.filter(l=>l.player===p.id&&!l.undone).length>=5],['ten','🏅','Ten Victories',p=>data.logs.filter(l=>l.player===p.id&&!l.undone).length>=10],['hero','👑','Rising Hero',p=>level(p)>=3],['quest','📜','Quest Keeper',p=>data.quests.some(q=>q.to===p.id&&q.awarded)],['gold','🪙','Treasure Hunter',p=>p.xp>=1000]];
function checkAchievements(playerId){let p=data.players.find(p=>p.id===playerId);if(!p)return;achievementRules.forEach(([id,icon,title,test])=>{if(test(p)&&!data.achievements.some(a=>a.id===id&&a.player===playerId)){data.achievements.push({id,player:playerId,at:new Date().toISOString()});event('achievement',p.name+' unlocked '+title)}})}
const dailyXP=(player,date)=>data.ledger.filter(t=>t.player===player&&t.kind==='xp'&&t.amount>0&&t.at.slice(0,10)===date&&t.source!=='champion').reduce((a,t)=>a+t.amount,0);
function periodKey(date,kind){return datePeriod(date,kind)}
function settleChampions(){let now=new Date();for(let offset=1;offset<=35;offset++){let d=new Date(now);d.setDate(d.getDate()-offset);let date=localDate(d);for(let kind of ['daily','weekly','monthly']){if(kind==='weekly'&&d.getDay()!==0)continue;if(kind==='monthly'&&new Date(d.getFullYear(),d.getMonth()+1,0).getDate()!==d.getDate())continue;let key=periodKey(date,kind);if(data.champions.some(c=>c.kind===kind&&c.key===key))continue;let from=kind==='daily'?date:kind==='weekly'?periodKey(date,'weekly'):date.slice(0,7)+'-01';let scores=data.players.map(p=>({id:p.id,xp:data.ledger.filter(t=>t.player===p.id&&t.kind==='xp'&&t.amount>0&&t.source!=='champion'&&t.at.slice(0,10)>=from&&t.at.slice(0,10)<=date).reduce((a,t)=>a+t.amount,0)}));let max=Math.max(...scores.map(x=>x.xp));let winners=max>0?scores.filter(x=>x.xp===max).map(x=>x.id):[];data.champions.push({id:uid(),kind,key,date,winners,scores});if(winners.length){let bonus=Number(data.settings[kind+'BonusXP']||0),coins=kind==='daily'?Number(data.settings.dailyBonusCoins||0):0;winners.forEach(id=>{if(bonus)credit(id,bonus,'champion',kind+' winner '+key);if(coins){data.players.find(p=>p.id===id).coins+=coins;transaction(id,'gold',coins,'champion',kind+' winner '+key)}})}}}save()}
function award(xp){credit(data.current,xp,'task','Task completion')}
function nav(to){page=to;filter='All';render();window.scrollTo(0,0)}function taskVisible(t){return t.owner==='shared'||t.owner===data.current}function render(){const titles={home:'Your Adventure',tasks:'Quest Journal',quests:'Quest Board',rewards:'Treasure Shop',messages:'Messages',stats:'Adventure Chronicle',goals:'Long-Term Goals',settings:'Settings & Admin',approvals:'Approval Inbox',more:'More Adventures',requests:'XP Requests',photos:'Photo Library',atlas:'Icon Atlas Library'};const tabs=[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Rewards'],['messages','✉','Messages'],['stats','◫','Stats'],['goals','◈','Goals'],['approvals','✓','Approvals'],['settings','⚙','Settings']];document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="assets/our-quest-icon.png"><div><b>Our Quest</b><small>A SHARED ADVENTURE</small></div></div><nav class="nav">${tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><div class="sidefoot">✦ V1.5.0 local preview<br>Local demonstration mode<br><br>Data is saved on this device only. Cloud syncing is not connected.</div></aside><main><header class="top"><div><div class="eyebrow">✧ OUR QUEST · ${safe(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}</div><h1>${titles[page]||'Our Quest'}</h1></div><div class="topright"><span class="chip">🪙 ${num(me().coins)}</span><select class="selectSmall" aria-label="Active demo profile" onchange="switchPlayer(this.value)">${data.players.map(p=>`<option value="${p.id}" ${p.id===data.current?'selected':''}>${p.icon} ${safe(p.name)}</option>`).join('')}</select></div></header><div class="notice">Preview mode: Switching players simulates two accounts on this browser. It is not secure authentication or cross-phone synchronization.</div>${({home:homeView,tasks:tasksView,quests:questsView,rewards:rewardsView,messages:messagesView,stats:statsView,goals:goalsView,settings:settingsView,approvals:approvalsView,more:moreView,requests:requestXPView,photos:photosView,atlas:atlasView}[page]||homeView)()}</main><nav class="bottom">${[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Shop'],['more','☷','More']].map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav></div>${modal?modalView():''}`}
function homeView(){const p=me(),logs=data.logs.filter(l=>l.player===p.id&&l.date===today()&&!l.undone);return `<div class="hero"><div class="card heroMain"><div class="eyebrow">WELCOME BACK, ${safe(p.name.toUpperCase())}</div><div class="heroTitle">Level ${level(p)} ${rankName(level(p))}</div><div class="heroSub">Every little victory is part of your story. Your next chapter starts today.</div><div class="row between" style="margin-top:20px"><span class="tiny">✦ ${num(p.xp)} XP</span><span class="tiny">${num(levelNext(p)-p.xp)} to next level</span></div><div class="bar"><i style="width:${levelPercent(p)}%"></i></div><button class="btn" style="margin-top:14px" onclick="nav('tasks')">✦ Log an Activity</button></div><div class="heroAside"><div class="card"><div class="statLabel">Today's completions</div><div class="stat">${logs.length}</div><span class="green tiny">✦ +${num(logs.reduce((s,l)=>s+l.xp,0))} XP today</span></div><div class="card"><div class="statLabel">Gold coins</div><div class="stat">${num(p.coins)}</div><span class="muted tiny">Spend in Treasure Shop</span></div><div class="card"><div class="statLabel">Active quests</div><div class="stat">${data.quests.filter(q=>q.to===p.id&&q.status==='accepted').length}</div><span class="muted tiny">Adventures awaiting you</span></div><div class="card"><div class="statLabel">Partner's level</div><div class="stat">${level(other())}</div><span class="muted tiny">${safe(other().name)} · ${num(other().xp)} XP</span></div></div></div><div class="grid two"><section class="card"><div class="row between"><h2>✧ Quick Log</h2><button class="btn2 tiny" onclick="nav('tasks')">All Tasks →</button></div>${data.tasks.filter(taskVisible).slice(0,5).map(taskLine).join('')||'<div class="empty">Create your first task.</div>'}</section><section class="card"><div class="row between"><h2>⚔ Your Quest Board</h2><button class="btn2 tiny" onclick="nav('quests')">View Quests →</button></div>${data.quests.filter(q=>q.to===p.id&&q.status!=='appr function taskLine(t){let count=countTask(t),max=maxTask(t),done=count>=max,available=taskAvailable(t);return `<div class="task" style="opacity:${done||!available?'.55':'1'}"><div class="taskIcon">${t.emoji?.startsWith('data:')?`<img src="${t.emoji}">`:safe(t.emoji||'✨')}</div><div style="flex:1;min-width:0"><div class="taskName">${safe(t.name)}</div><div class="tiny muted">${safe(t.category)} · ${safe(t.frequency||'daily')} · <span class="gold">+${t.xp} XP</span> · ${count}/${max} completed</div>${done?'<span class="tag">✓ Complete until next reset</span>':!available?'<span class="tag">Outside availability window</span>':''}</div><button class="iconbtn" onclick="logTask('${t.id}')" ${done||!available?'disabled':''}>${done?'✓':'+ XP'}</button></div>`}
function tasksView(){let cats=['All',...new Set(data.tasks.filter(taskVisible).map(t=>t.category))],list=data.tasks.filter(t=>taskVisible(t)&&(filter==='All'||t.category===filter));return `<div class="row between wrap"><p class="muted">Recurring activities reset by schedule. Completed tasks lock until their next period.</p>${isAdmin()?`<div class="row wrap"><button class="btn2" onclick="openModal('category')">⚙ Categories</button><button class="btn" onclick="openModal('task')">＋ Create Task</button></div>`:''}</div><div class="tabs">${cats.map(c=>`<button class="${filter===c?'active':''}" onclick="setFilter('${safe(c)}')">${safe(c)}</button>`).join('')}</div><section class="card">${list.map(t=>`<div class="row between" style="gap:5px"><div style="flex:1;min-width:0">${taskLine(t)}</div>${isAdmin()?`<button class="iconbtn" title="Edit task" onclick="openModal('editTask','${t.id}')">✎</button>`:''}</div>`).join('')||'<div class="empty">No tasks in this category.</div>'}</section>${isAdmin()?`<div class="card section"><h2>Bulk Task Tools</h2><button class="btn2" onclick="duplicateTaskPrompt()">Duplicate a task</button> <button class="btn2" onclick="bulkSchedule()">Change category schedule</button></div>`:''}`}

function duplicateTaskPrompt(){if(!isAdmin())return;let name=prompt('Enter the exact task name to duplicate');let t=data.tasks.find(t=>t.name===name);if(!t)return notify('Task not found');data.tasks.push({...t,id:uid(),name:t.name+' (copy)'});save();render()}

function questLine(q){let status={pending:'Awaiting response',accepted:'In progress',submitted:'Awaiting approval',approved:'Completed',declined:'Declined',expired:'Expired'}[q.status]||q.status;let count=q.lastCompletedDate===today()?Number(q.completedCount||0):0,max=Number(q.maxPerDay||1);if(q.deadline&&q.deadline<today()&&!['approved','declined'].includes(q.status))status='Overdue';let canRepeat=q.status==='approved'&&(q.lastCompletedDate!==today()||count<max);return `<div class="listline"><div class="row between"><div><b>${safe(q.title)}</b><div class="tiny muted">${safe(q.from===data.current?'Sent to '+other().name:'From '+other().name)} · <span class="gold">${q.xp} XP</span> · ${status} · ${count}/${max} today</div></div><span class="tag">${status}</span></div>${q.description?`<p class="tiny muted">${safe(q.description)}</p>`:''}${q.deadline?`<div class="tiny muted">Due ${safe(q.deadline)}</div>`:''}<div class="row wrap" style="margin-top:8px">${q.to===data.current&&q.status==='pending'?`<button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Accept</button><button class="btn2 tiny" onclick="questAction('${q.id}','declined')">Decline</button>`:''}${q.to===data.current&&q.status==='accepted'?`<button class="btn tiny" onclick="questAction('${q.id}','submitted')">Mark Complete</button>`:''}${q.from===data.current&&q.status==='submitted'?`<button class="btn tiny" onclick="questAction('${q.id}','approved')">Approve +XP</button><button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Request Changes</button>`:''}${q.to===data.current&&canRepeat?`<button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Repeat Quest</button>`:''}</div></div>`}

function rewardsView(){return `<div class="row between wrap"><p class="muted">Purchase coupons, request redemption and track fulfillment.</p>${isAdmin()?`<button class="btn" onclick="openModal('reward')">＋ Create Coupon</button>`:''}</div><div class="grid">${data.rewards.map(r=>`<div class="card"><div style="font-size:36px">${safe(r.emoji)}</div><h2 style="margin-top:10px">${safe(r.name)}</h2><p class="muted tiny" style="min-height:35px">${safe(r.description)}</p><div class="row between"><b class="gold">🪙 ${num(r.price)}</b><button class="btn" onclick="buyReward('${r.id}')" ${me().coins<r.price?'disabled':''}>Purchase</button></div></div>`).join('')}</div><section class="card section"><h2>🎟 Your Coupon Wallet</h2>${data.purchases.filter(p=>p.buyer===data.current||p.provider===data.current).map(p=>{let r=data.rewards.find(r=>r.id===p.rewardId);return `<div class="listline row between"><div><b>${safe(r?.name||'Archived coupon')}</b><div class="tiny muted">${safe(p.status)} · ${p.purchasedAt?new Date(p.purchasedAt).toLocaleDateString():''}</div></div>${p.buyer===data.current&&p.status==='active'?`<button class="btn2" onclick="redeem('${p.id}')">Request redemption</button>`:''}${p.provider===data.current&&p.status==='requested'?`<button class="btn" onclick="fulfillCoupon('${p.id}')">Confirm fulfilled</button>`:''}</div>`}).join('')||'<div class="empty">Your wallet is empty.</div>'}</section><section class="card section"><h2>Coupon Usage History</h2>${data.purchases.slice().reverse().map(p=>`<div class="listline tiny">${safe(data.rewards.find(r=>r.id===p.rewardId)?.name||'Archived')} · ${safe(p.status)} · ${safe(p.buyer)} · ${p.purchasedAt?new Date(p.purchasedAt).toLocaleString():'Legacy purchase'}</div>`).join('')||'<div class="empty">No coupons purchased yet.</div>'}</section>`}
function messagesView(){return `<div class="card" style="max-width:740px;margin:auto"><div class="row between"><h2>✉ ${safe(other().name)}</h2><span class="tag">Local preview</span></div><div style="min-height:260px;max-height:480px;overflow:auto;padding:12px 0">${data.messages.map(m=>`<div style="display:flex;justify-content:${m.from===data.current?'flex-end':'flex-start'};margin:9px 0"><div style="background:${m.from===data.current?'#59357d':'#332643'};padding:11px 14px;border-radius:14px;max-width:85%;overflow-wrap:anywhere"><div class="tiny gold">${safe(data.players.find(p=>p.id===m.from)?.name||'')}</div>${safe(m.text)}<div class="tiny muted">${new Date(m.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">Say hello to start your conversation.</div>'}</div><form onsubmit="sendMessage(event)" class="row"><input name="text" aria-label="Message" placeholder="Write a message..." maxlength="1000" required style="flex:1;min-width:0;padding:12px;background:#120d20;color:white;border:1px solid #59416c;border-radius:10px"><button class="btn" type="submit">Send ↗</button></form><p class="tiny muted">Messages are only visible on this device in the current stage. They are not sent to your partner's phone.</p></div>`}
function statsView(){let p=me(),logs=data.logs.filter(l=>l.player===p.id&&!l.undone);let byDate={};logs.forEach(l=>byDate[l.date]=(byDate[l.date]||0)+l.xp);let days=Array.from({length:35},(_,i)=>{let d=new Date();d.setDate(d.getDate()-34+i);return localDate(d)});return `<div class="grid"><div class="card"><div class="statLabel">Lifetime XP</div><div class="stat">${num(p.xp)}</div></div><div class="card"><div class="statLabel">Activities</div><div class="stat">${logs.length}</div></div><div class="card"><div class="statLabel">Level & Title</div><div class="stat">${level(p)}</div><span class="gold tiny">${rankName(level(p))}</span></div></div><div class="grid two section"><div class="card"><h2>🏆 Achievements</h2>${achievementRules.map(([id,icon,title])=>`<div class="listline row between"><span>${icon} ${title}</span><span class="tag">${data.achievements.some(a=>a.id===id&&a.player===p.id)?'Unlocked':'Locked'}</span></div>`).join('')}</div><div class="card"><h2>📅 Activity Heatmap</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${days.map(d=>`<div title="${d}: ${byDate[d]||0} XP" style="height:26px;border-radius:5px;background:${!byDate[d]?'#302340':byDate[d]<50?'#65438d':byDate[d]<150?'#9860c0':'#dfae6c'}"></div>`).join('')}</div><p class="muted tiny">Last 35 days · darker means less activity</p><h3>Champion History</h3>${data.champions.slice(-8).reverse().map(c=>`<div class="listline tiny">${safe(c.kind)} ${safe(c.key)} · ${c.winners.map(id=>data.players.find(p=>p.id===id)?.name).join(' & ')||'No winner'}</div>`).join('')||'<p class="muted tiny">Champions settle after each period ends.</p>'}</div></div><div class="grid two section"><div class="card"><h2>Activity by Day</h2>${Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([date,xp])=>`<div class="listline"><div class="row between tiny"><span>${safe(date)}</span><span class="gold">${xp} XP</span></div><div class="bar"><i style="width:${Math.min(100,xp/Math.max(1,...Object.values(byDate))*100)}%"></i></div></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div><div class="card"><h2>XP & Gold Ledger</h2>${data.ledger.filter(l=>l.player===p.id).slice(0,25).map(l=>`<div class="listline row between tiny"><div>${safe(l.detail||l.source)}<div class="muted">${new Date(l.at).toLocaleString()}</div></div><b class="${l.amount>=0?'green':'danger'}">${l.amount>0?'+':''}${l.amount} ${l.kind==='xp'?'XP':'Gold'}</b></div>`).join('')||'<div class="empty">No transactions yet.</div>'}<button class="btn2" onclick="exportData()">↓ Export All Data</button></div></div><div class="card section"><h2>Completion History</h2>${logs.slice().reverse().slice(0,20).map(l=>`<div class="listline row between"><div><b>${safe(l.name)}</b><div class="tiny muted">${safe(l.date)}</div></div><div class="row"><span class="gold">+${l.xp} XP</span>${l.player===data.current?`<button class="btn2 tiny" onclick="undoLog('${l.id}')">Undo</button>`:''}</div></div>`).join('')||'<div class="empty">No completed tasks yet.</div>'}</div>`}
function goalsView(){return `<div class="row between wrap"><p class="muted">Build toward something meaningful, one milestone at a time.</p><button class="btn" onclick="openModal('goal')">＋ Create Goal</button></div><div class="grid two">${data.goals.filter(g=>g.owner==='shared'||g.owner===data.current).map(g=>`<div class="card"><div class="row between"><h2>◈ ${safe(g.title)}</h2><span class="tag">${g.owner==='shared'?'Shared':'Personal'}</span></div><p class="muted tiny">${safe(g.description)}</p><div class="row between tiny"><span>Progress</span><b class="gold">${g.progress} / ${g.target}</b></div><div class="bar"><i style="width:${Math.min(100,g.progress/g.target*100)}%"></i></div><button class="btn2" style="margin-top:13px" onclick="goalProgress('${g.id}')" ${g.progress>=g.target?'disabled':''}>＋ Progress</button></div>`).join('')||'<div class="empty">No goals yet. Set your first milestone!</div>'}</div>`}
function moreView(){return `<div class="grid two">${[['messages','✉','Messages'],['stats','◫','Statistics & Achievements'],['goals','◈','Long-Term Goals'],['approvals','✓','Approval Inbox'],['settings','⚙','Settings & Admin']].map(([p,i,t])=>`<button class="card" style="color:white;text-align:left;font-weight:800;font-size:17px" onclick="nav('${p}')">${i} ${t} →</button>`).join('')}</div>`}
function approvalsView(){let quests=data.quests.filter(q=>q.from===data.current&&q.status==='submitted'),coupons=data.purchases.filter(p=>p.provider===data.current&&p.status==='requested');return `<div class="card"><h2>Pending Quest Approvals (${quests.length})</h2>${quests.map(questLine).join('')||'<p class="muted">Nothing awaiting approval.</p>'}</div><div class="card section"><h2>Coupon Fulfillment Requests (${coupons.length})</h2>${coupons.map(p=>`<div class="listline row between"><b>${safe(data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon')}</b><button class="btn" onclick="fulfillCoupon('${p.id}')">Confirm Fulfilled</button></div>`).join('')||'<p class="muted">No coupon requests.</p>'}</div>`}

function settingsView(){return `<div class="grid two"><div class="card"><h2>⚙ Economy Settings</h2>${isAdmin()?`<p class="muted tiny">Admin-only settings in this local demo.</p>${[['coinRate','XP earned per coin'],['xpCap','Maximum XP per task'],['backdate','Backdating window (days)'],['dailyBonusXP','Daily champion bonus XP'],['dailyBonusCoins','Daily champion bonus gold'],['weeklyBonusXP','Weekly champion bonus XP'],['monthlyBonusXP','Monthly champion bonus XP']].map(([k,label])=>`<div class="field"><label>${label}</label><input type="number" min="0" id="${k}" value="${data.settings[k]}"></div>`).join('')}<button class="btn" onclick="saveSettings()">Save Settings</button>`:'<p class="muted">Only Matthew can edit global settings.</p>'}</div><div class="card"><h2>♜ Data & Maintenance</h2><p class="muted tiny">Data is stored in this browser only. Export backups regularly.</p><button class="btn2" onclick="exportData()">↓ Export JSON Backup</button>${isAdmin()?`<div class="field"><label>Restore JSON backup</label><input type="file" accept=".json,application/json" onchange="importData(event)"></div>`:''}<hr class="divider"><h3>Audit History</h3>${data.events.slice(0,20).map(e=>`<div class="listline tiny">${safe(e.actor)} · ${safe(e.type)}<br><span class="muted">${safe(e.detail)} · ${new Date(e.at).toLocaleString()}</span></div>`).join('')||'<p class="muted tiny">No events yet.</p>'}</div></div><div class="card section"><h2>About V1.2.0</h2><p class="muted">Local prototype with image attachments, quest proof, XP requests, partner activity, recurrence, approvals, achievements and coupon history. Still no real authentication, remote sync, push notifications or automatic cloud backups.</p><span class="tag">Local-only preview</span> <span class="tag">Export before updating</span></div>`}
function openModal(type,id=''){if(['task','editTask','category','reward'].includes(type)&&!isAdmin())return notify('Admin only');modal=type+'|'+id;render()}function closeModal(){modal='';render()}function modalView(){let [type,id]=modal.split('|'),t=data.tasks.find(t=>t.id===id);if(['task','editTask','category','reward'].includes(type)&&!isAdmin())return '';let head={task:'Create Task',editTask:'Edit Task',category:'Manage Categories',quest:'Send a Quest',reward:'Create a Coupon',goal:'Create a Goal'}[type];let body='';if(type==='task'||type==='editTask'){let cats=(Array.isArray(data.categories)?data.categories:[]).map(c=>c.name);if(!cats.length)cats=['Home','Wellness','Together'];if(t&&!cats.includes(t.category))cats.push(t.category);let defaultFreq=t?.frequency||'daily';body=`<div class="field"><label>Task Name</label><input name="name" required maxlength="80" value="${safe(t?.name||'')}"></div><div class="field"><label>Task description</label><textarea name="description" maxlength="1200">${safe(t?.description||'')}</textarea></div><div class="formGrid"><div class="field"><label>Icon / Emoji</label><input name="emoji" maxlength="8" value="${safe(t?.emoji||'✨')}"><button type="button" class="btn2" style="margin-top:8px" onclick="openAtlasPicker()">▦ Choose from Icon Atlas</button><div id="atlasChoicePreview" class="tiny muted" style="margin-top:5px">${t?.atlas?'Selected atlas icon: page '+(atlasPageIndex(t.atlas.page)+1)+(Number.isInteger(t.atlas.cell)?', cell '+(t.atlas.cell+1):' (custom crop)'):'No atlas icon selected'}</div></div><div class="field"><label>Category</label><select name="category" onchange="categoryDefaultChanged(this.value)">${cats.map(c=>`<option ${c===t?.category?'selected':''}>${safe(c)}</option>`).join('')}</select></div><div class="field"><label>XP Reward</label><input name="xp" type="number" min="1" max="${data.settings.xpCap}" required value="${t?.xp||25}"></div><div class="field"><label>Difficulty</label><select name="difficulty">${['Easy','Normal','Hard','Epic','Legendary'].map(d=>`<option ${t?.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select name="owner"><option value="shared" ${t?.owner==='shared'?'selected':''}>Shared</option><option value="matthew" ${t?.owner==='matthew'?'selected':''}>Private to Matthew</option><option value="beth" ${t?.owner==='beth'?'selected':''}>Private to Beth</option></select></div><div class="field"><label>Allowed completions</label><select name="schedulePreset" onchange="applySchedulePreset(this.value)">${scheduleOptions(t).map(x=>`<option value="${x.id}" ${x.selected?'selected':''}>${x.label}</option>`).join('')}</select><div class="tiny muted">Select a schedule to automatically set the recurrence and completion limit.</div></div><div class="field"><label>Recurrence</label><select name="frequency">${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['quarterly','Every 3 months'],['semiannual','Every 6 months'],['annual','Annual'],['once','One time']].map(([v,l])=>`<option value="${v}" ${defaultFreq===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Maximum completions per period</label><input name="maxPerPeriod" type="number" min="1" max="100" value="${t?.maxPerPeriod||1}"></div><div class="field"><label>Earliest hour (0–23, optional)</label><input name="startHour" type="number" min="0" max="23" value="${t?.startHour??''}"></div><div class="field"><label>Latest hour (1–24, optional)</label><input name="endHour" type="number" min="1" max="24" value="${t?.endHour??''}"></div></div><div class="field"><label>Available weekdays (leave all unchecked for every day)</label><div class="row wrap">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label class="tiny"><input type="checkbox" name="day${i}" value="1" ${t?.days?.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>`}if(type==='category')body=`<p class="muted tiny">Categories determine defaults for new tasks. Existing task schedules remain unchanged unless bulk edited.</p>${(Array.isArray(data.categories)?data.categories:[]).map(c=>`<div class="listline row between"><span>${safe(c.emoji)} ${safe(c.name)} · ${safe(c.frequency)}</span><button type="button" class="btn2" onclick="removeCategory('${safe(c.name)}')">Delete</button></div>`).join('')}<div class="field"><label>New Category Name</label><input name="name" required maxlength="40"></div><div class="field"><label>Emoji</label><input name="emoji" maxlength="8" value="✨"></div><div class="field"><label>Default recurrence</label><select name="frequency">${['daily','weekly','monthly','quarterly','semiannual','annual','once'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>`;if(type==='quest')body=`<div class="field"><label>Quest Title</label><input name="title" required maxlength="100" placeholder="A noble quest for ${safe(other().name)}"></div><div class="field"><label>Description</label><textarea name="description" maxlength="1000"></textarea></div><div class="formGrid"><div class="field"><label>XP Reward per approval</label><input name="xp" type="number" min="1" max="${data.settings.xpCap}" required value="75"></div><div class="field"><label>Maximum completions per day</label><input name="maxPerDay" type="number" min="1" max="20" value="1"></div></div><div class="field"><label>Due date (optional)</label><input name="deadline" type="date"></div>`;if(type==='reward')body=`<div class="field"><label>Coupon Name</label><input name="name" required maxlength="80" placeholder="Dinner date"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="formGrid"><div class="field"><label>Emoji</label><input name="emoji" value="🎁" maxlength="8"></div><div class="field"><label>Coin Price</label><input name="price" type="number" min="1" max="100000" value="100" required></div></div><div class="field"><label>Provider</label><select name="provider"><option value="matthew">Matthew</option><option value="beth">Beth</option><option value="either">Either</option></select></div>`;if(type==='goal')body=`<div class="field"><label>Goal Title</label><input name="title" required maxlength="100"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Target Count</label><input name="target" type="number" min="1" max="100000" value="10" required></div><div class="field"><label>Visibility</label><select name="owner"><option value="shared">Shared</option><option value="${data.current}">Personal</option></select></div>`;return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${head}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="submitModal(event,'${type}','${id}')">${body}<div class="actions"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button type="submit" class="btn">${type==='quest'?'Send Quest':'Save'}</button></div></form></div></div>`}
function submitModal(e,type,id){e.preventDefault();let f=new FormData(e.target),g=k=>String(f.get(k)||'').trim();if(['task','editTask','category','reward'].includes(type)&&!isAdmin())return notify('Admin only');if(type==='category'){let name=g('name');if(!name||data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return notify('Invalid or duplicate category');data.categories.push({name,emoji:g('emoji')||'✨',frequency:g('frequency')});event('category created',name)}if(type==='task'||type==='editTask'){let o={name:g('name'),description:g('description'),emoji:g('emoji')||'✨',category:g('category')||'Home',xp:Number(g('xp')),difficulty:g('difficulty'),owner:g('owner'),frequency:g('frequency'),maxPerPeriod:Number(g('maxPerPeriod'))||1,startHour:g('startHour'),endHour:g('endHour'),days:[0,1,2,3,4,5,6].filter(i=>g('day'+i)==='1')};if(!o.name||o.xp<1||o.xp>data.settings.xpCap)return notify('Invalid task XP or name');if(type==='editTask'){let t=data.tasks.find(t=>t.id===id);if(t)Object.assign(t,o)}else data.tasks.push({id:uid(),...o});event('task',o.name)}if(type==='quest'){let xp=Number(g('xp')),max=Number(g('maxPerDay'));if(!g('title')||xp<1||xp>data.settings.xpCap||max<1||max>20)return notify('Invalid quest settings');data.quests.unshift({id:uid(),title:g('title'),description:g('description'),xp,from:data.current,to:other().id,status:'pending',maxPerDay:max,completedCount:0,awarded:false,deadline:g('deadline'),history:[],created:new Date().toISOString()});event('quest',g('title'))}if(type==='reward'){data.rewards.push({id:uid(),name:g('name'),description:g('description'),emoji:g('emoji')||'🎁',price:Number(g('price')),provider:g('provider')});event('reward',g('name'))}if(type==='goal'){data.goals.push({id:uid(),title:g('title'),description:g('description'),target:Number(g('target')),progress:0,owner:g('owner')});event('goal',g('title'))}modal='';save();render();notify('Saved successfully ✦')}
function categoryDefaultChanged(name){let cat=data.categories.find(c=>c.name===name),sel=document.querySelector('select[name=frequency]');if(cat&&sel)sel.value=cat.frequency}
function removeCategory(name){if(!isAdmin())return;if(data.tasks.some(t=>t.category===name))return notify('Move or reassign tasks before deleting this category');if(!confirm('Delete category '+name+'?'))return;data.categories=data.categories.filter(c=>c.name!==name);save();render()}

function switchPlayer(id){if(window.oqCloudActive)return notify('Your account is selected by your secure login');if(data.players.some(p=>p.id===id)){data.current=id;save();render()}}function logTask(id){let t=data.tasks.find(t=>t.id===id);if(!t||!taskVisible(t))return;let count=countTask(t);if(count>=maxTask(t))return notify('Task already completed for this period');if(!taskAvailable(t))return notify('Task unavailable at this time');let l={id:uid(),taskId:id,name:t.name,player:data.current,date:today(),xp:t.xp,at:new Date().toISOString()};data.logs.push(l);credit(data.current,t.xp,'task',t.name);event('task completed',t.name+' +'+t.xp+' XP');save();render();notify('✦ +'+t.xp+' XP earned!')}
function undoLog(id){let l=data.logs.find(l=>l.id===id);if(!l||l.player!==data.current||l.undone)return;let recent=Date.now()-new Date(l.at||l.date+'T12:00:00').getTime();if(recent>24*3600*1000)return notify('Undo available for 24 hours');if(!confirm('Undo this task completion and reverse XP/coins?'))return;l.undone=true;debitXP(l.player,l.xp,'undo');event('undo',l.name);save();render()}

function questAction(id,status){let q=data.quests.find(q=>q.id===id);if(!q)return;let previous=q.status;if(previous==='approved'&&status==='accepted'){if(q.to!==data.current||(q.lastCompletedDate===today()&&q.completedCount>=q.maxPerDay))return; if(q.lastCompletedDate!==today())q.completedCount=0;q.status='accepted';q.awarded=false}else{const allowed={pending:['accepted','declined'],accepted:['submitted'],submitted:['approved','accepted']};if(!allowed[previous]?.includes(status))return;if(previous==='pending'&&q.to!==data.current)return;if(previous==='accepted'&&q.to!==data.current)return;if(previous==='submitted'&&q.from!==data.current)return;q.status=status}q.history??=[];q.history.push({action:status,actor:data.current,at:new Date().toISOString()});if(status==='approved'&&previous==='submitted'){if(q.awarded)return;q.awarded=true;q.completedCount=(q.lastCompletedDate===today()?Number(q.completedCount||0):0)+1;q.lastCompletedDate=today();credit(q.to,q.xp,'quest',q.title);event('quest approved',q.title+' → '+q.to+' +'+q.xp+' XP')}else event('quest '+status,q.title);save();render();notify(status==='approved'?'Quest approved: '+q.xp+' XP awarded to '+data.players.find(p=>p.id===q.to)?.name:'Quest updated!')}

function buyReward(id){let r=data.rewards.find(r=>r.id===id);if(!r||me().coins<r.price)return notify('Not enough coins');if(!confirm(`Spend ${r.price} gold on ${r.name}?`))return;me().coins-=r.price;transaction(data.current,'gold',-r.price,'coupon',r.name);data.purchases.unshift({id:uid(),rewardId:id,buyer:data.current,provider:r.provider==='either'?other().id:r.provider,status:'active',price:r.price,purchasedAt:new Date().toISOString(),history:[{action:'purchased',at:new Date().toISOString()}]});event('coupon purchased',r.name);save();render();notify('Coupon added to your wallet!')}
function redeem(id){let p=data.purchases.find(p=>p.id===id);if(!p||p.buyer!==data.current||p.status!=='active')return;if(!confirm('Request redemption? The provider must confirm fulfillment.'))return;p.status='requested';p.redeemedAt=new Date().toISOString();p.history.push({action:'requested',at:p.redeemedAt});event('coupon redemption requested',data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon');save();render()}
function fulfillCoupon(id){let p=data.purchases.find(p=>p.id===id);if(!p||p.provider!==data.current||p.status!=='requested')return;p.status='fulfilled';p.fulfilledAt=new Date().toISOString();p.history.push({action:'fulfilled',at:p.fulfilledAt});event('coupon fulfilled',data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon');save();render()}

function sendMessage(e){e.preventDefault();let f=new FormData(e.target),s=String(f.get('text')||'').trim();if(!s)return;data.messages.push({id:uid(),from:data.current,to:other().id,text:s,at:new Date().toISOString()});save();render()}function goalProgress(id){let g=data.goals.find(g=>g.id===id);if(!g||g.progress>=g.target)return;g.progress++;event('goal progress',g.title);save();render()}function saveSettings(){if(!isAdmin())return;let keys=['coinRate','xpCap','backdate','dailyBonusXP','dailyBonusCoins','weeklyBonusXP','monthlyBonusXP'];let values=Object.fromEntries(keys.map(k=>[k,Number(document.getElementById(k).value)]));if(keys.some(k=>!Number.isFinite(values[k])||values[k]<0)||values.coinRate<1||values.xpCap<1)return notify('Please enter valid settings');Object.assign(data.settings,values);event('settings','Economy rules updated');save();render();notify('Settings saved')}

function xpRequestAction(id,action){let r=data.xpRequests.find(x=>x.id===id);if(!r)return;let mine=r.from===data.current,reviewer=r.to===data.current;if(action==='approve'){if(!reviewer||r.awarded||!['pending','responded','counter_accepted'].includes(r.status))return;r.awarded=true;r.status='approved';credit(r.from,r.xp,'xp_request',r.title);event('XP request approved',r.private?'Private activity':r.title)}else if(action==='decline'){if(!(reviewer||mine)||['approved','declined'].includes(r.status))return;r.status='declined'}else if(action==='counter'){if(!reviewer||!['pending','responded'].includes(r.status))return;let value=prompt('Propose XP amount',r.xp);if(value===null)return;let n=Number(value);if(!Number.isInteger(n)||n<1||n>data.settings.xpCap)return notify('Invalid XP amount');r.xp=n;r.status='countered'}else if(action==='accept_counter'){if(!mine||r.status!=='countered')return;r.status='counter_accepted'}else if(action==='question'){if(!reviewer||!['pending','responded'].includes(r.status))return;let msg=prompt('Question for '+other().name);if(!msg?.trim())return;r.status='questioned';r.history.push({action:'question',message:msg.trim(),by:data.current,at:new Date().toISOString()})}else if(action==='reply'){if(!mine||r.status!=='questioned')return;let msg=prompt('Reply to question');if(!msg?.trim())return;r.status='responded';r.history.push({action:'reply',message:msg.trim(),by:data.current,at:new Date().toISOString()})}else return;r.history.push({action,by:data.current,at:new Date().toISOString()});save();render();notify('Request updated')}

function atlasIconHtml(ref){if(!ref||!atlasSource(ref.page))return '✨';let col=ref.cell%10,row=Math.floor(ref.cell/10);return `<span class="atlas-icon" style="background-image:url('${atlasSource(ref.page)}');--ax:${col*100/9}%;--ay:${row*100/9}%" role="img" aria-label="Atlas icon ${ref.cell+1}"></span>`}
function atlasGrid(id,selectable=true){return `<div class="atlas-grid" role="group" aria-label="100 icons in a 10 by 10 grid">${Array.from({length:100},(_,i)=>`<button type="button" class="atlas-cell ${pendingAtlas?.page===id&&pendingAtlas?.cell===i?'chosen':''}" aria-label="Select icon ${i+1}" title="Row ${Math.floor(i/10)+1}, column ${i%10+1}" onclick="${selectable?`selectAtlasIcon('${id}',${i})`:`previewAtlasIcon('${id}',${i})`}">${atlasIconHtml({page:id,cell:i})}</button>`).join('')}</div>`}
function atlasPickerHtml(){let page=data.atlasPages.find(p=>p.id===atlasPickerPage)||data.atlasPages[0];if(!page)return '';return `<div class="modalback atlas-pick-modal" id="atlasPicker" onclick="if(event.target===this)closeAtlasPicker()"><div class="modal"><div class="row between"><h2>▦ Choose an Icon</h2><button class="iconbtn" onclick="closeAtlasPicker()">✕</button></div><p class="tiny muted">Each square selects exactly one icon from the original sheet. No individual icon files are created.</p><div class="field"><label>Atlas page</label><select onchange="atlasPickerPage=this.value;refreshAtlasPicker()">${data.atlasPages.map(p=>`<option value="${p.id}" ${page.id===p.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div>${atlasGrid(page.id)}<div class="row between" style="margin-top:14px"><span class="tiny muted">${pendingAtlas?'Selected: page '+(atlasPageIndex(pendingAtlas.page)+1)+', icon '+(pendingAtlas.cell+1):'Select a square to assign it'}</span><button class="btn2" onclick="closeAtlasPicker()">Done</button></div></div></div>`}
function refreshAtlasPicker(){let old=document.getElementById('atlasPicker');if(old)old.outerHTML=atlasPickerHtml()}
function openAtlasPicker(){if(!isAdmin())return notify('Admin only');atlasPickerPage=pendingAtlas?.page||data.atlasPages[0].id;atlasPickerOpen=true;document.body.insertAdjacentHTML('beforeend',atlasPickerHtml())}
function closeAtlasPicker(){atlasPickerOpen=false;document.getElementById('atlasPicker')?.remove();let label=document.getElementById('atlasChoicePreview');if(label)label.textContent=pendingAtlas?`Selected page ${atlasPageIndex(pendingAtlas.page)+1}, icon ${pendingAtlas.cell+1}`:'No atlas icon selected'}
function selectAtlasIcon(id,cell){pendingAtlas={page:id,cell};closeAtlasPicker();notify('Icon selected. Save the task to apply it.')}

function atlasView(){return `<div class="row between wrap"><p class="muted">100 selectable icons per page. Task icons reference the original sheet without duplicating image files.</p>${isAdmin()?`<label class="btn" style="cursor:pointer">＋ Upload 10×10 Sheet<input type="file" accept="image/png,image/webp,image/jpeg" style="display:none" onchange="uploadAtlas(event)"></label>`:''}</div><div class="card"><h2>▦ Atlas Pages (${data.atlasPages.length})</h2><div class="field"><label>Choose page</label><select onchange="atlasPickerPage=this.value;render()">${data.atlasPages.map(p=>`<option value="${p.id}" ${atlasPickerPage===p.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div>${(()=>{let pg=data.atlasPages.find(p=>p.id===atlasPickerPage)||data.atlasPages[0];return `<div class="row between wrap" style="margin-bottom:10px"><b>${safe(pg.name)}</b><span class="tiny muted">Page ${atlasPageIndex(pg.id)+1} of ${data.atlasPages.length} · 100 icons</span></div>${atlasGrid(pg.id,false)}${isAdmin()&&!pg.builtin?`<div class="row wrap" style="margin-top:12px"><button class="btn2" onclick="renameAtlas('${pg.id}')">Rename Page</button><button class="btn2" onclick="deleteAtlas('${pg.id}')">Delete Page</button></div>`:''}`})()}</div><div class="card section"><h2>How to use</h2><p class="muted tiny">As Matthew, open Tasks → Create/Edit Task → Choose from Icon Atlas. Select a square and save. New sheets must be square and contain 10 evenly spaced rows and columns. Uploaded pages stay on this browser until a cloud backend is connected.</p></div>`}
function openAtlasDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('our-quest-icon-atlases',1);r.onupgradeneeded=()=>r.result.createObjectStore('pages');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function atlasStore(id,blob){let db=await openAtlasDB();return new Promise((resolve,reject)=>{let tx=db.transaction('pages','readwrite');tx.objectStore('pages').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
async function atlasDelete(id){let db=await openAtlasDB();return new Promise((resolve,reject)=>{let tx=db.transaction('pages','readwrite');tx.objectStore('pages').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
async function loadAtlasPages(){try{let db=await openAtlasDB();for(let p of data.atlasPages.filter(p=>!p.builtin)){let blob=await new Promise((resolve,reject)=>{let tx=db.transaction('pages','readonly'),r=tx.objectStore('pages').get(p.id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(blob)atlasSources[p.id]=URL.createObjectURL(blob)}db.close();if(page==='atlas')render()}catch(e){console.warn('Atlas storage unavailable',e)}}
async function uploadAtlas(e){if(!isAdmin())return;let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return notify('Choose an image');try{let bmp=await createImageBitmap(file);if(Math.abs(bmp.width-bmp.height)>Math.max(bmp.width,bmp.height)*.07){bmp.close();return notify('Atlas must be square (10×10 uniform cells).')}let size=Math.min(1600,Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(bmp,0,0,size,size);bmp.close();let blob=await new Promise(r=>c.toBlob(r,'image/webp',.88));if(!blob)throw Error('Could not encode image');let name=prompt('Name this icon page',file.name.replace(/\.[^.]+$/,''));if(name===null)return;let id=uid();await atlasStore(id,blob);atlasSources[id]=URL.createObjectURL(blob);data.atlasPages.push({id,name:name.trim()||'New Icon Page',builtin:false});atlasPickerPage=id;save();render();notify('100-icon atlas page added')}catch(err){notify('Atlas upload failed: '+err.message)}}
function renameAtlas(id){if(!isAdmin())return;let p=data.atlasPages.find(p=>p.id===id);if(!p)return;let name=prompt('Atlas page name',p.name);if(!name?.trim())return;p.name=name.trim();save();render()}
async function deleteAtlas(id){if(!isAdmin())return;let p=data.atlasPages.find(p=>p.id===id);if(!p||p.builtin)return;if(data.tasks.some(t=>t.atlas?.page===id))return notify('This page is used by a task. Reassign its icon first.');if(!confirm('Delete this atlas page?'))return;data.atlasPages=data.atlasPages.filter(p=>p.id!==id);await atlasDelete(id);if(atlasSources[id]?.startsWith('blob:'))URL.revokeObjectURL(atlasSources[id]);delete atlasSources[id];atlasPickerPage=data.atlasPages[0].id;save();render()}

<script>
/* Our Quest v1.7.0: four clean transparent atlases and free-position crop editor */

 {id:'everyday',name:'Everyday Adventures · Clean',src:'assets/everyday-adventures-atlas.png',builtin:true},

 {id:'grand-adventures',name:'Grand Adventures · New',src:'assets/grand-adventures-atlas.png',builtin:true}
];
for(const p of V17_PAGES){
 const existing=data.atlasPages.find(a=>a.id===p.id);
 if(existing)Object.assign(existing,p);else data.atlasPages.push({...p});
 atlasSources[p.id]=p.src;
}

save();
// Allow user-uploaded free-position atlases without an artificial 10x10 restriction.
uploadAtlas=async function(e){
 if(!isAdmin())return;
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/'))return notify('Choose a PNG, WebP or JPEG image');
 try{
  const bmp=await createImageBitmap(file);
  const side=Math.min(2048,Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=c.height=side;
  const ctx=c.getContext('2d');
  const scale=side/Math.max(bmp.width,bmp.height);
  ctx.drawImage(bmp,(side-bmp.width*scale)/2,(side-bmp.height*scale)/2,bmp.width*scale,bmp.height*scale);
  bmp.close();
  const blob=await new Promise(resolve=>c.toBlob(resolve,'image/webp',.92));
  if(!blob)throw Error('Could not encode image');
  const name=prompt('Name this icon page',file.name.replace(/\.[^.]+$/,''));
  if(name===null)return;
  const id=uid();await atlasStore(id,blob);
  atlasSources[id]=URL.createObjectURL(blob);
  data.atlasPages.push({id,name:name.trim()||'New Icon Page',builtin:false});
  atlasPickerPage=id;save();render();notify('Icon atlas added');
 }catch(err){notify('Atlas upload failed: '+err.message)}
};

atlasView=function(){
 const pg=data.atlasPages.find(p=>p.id===atlasPickerPage)||data.atlasPages[0];
 return `<div class="row between wrap"><p class="muted">Four built-in icon sheets with no grid lines. Use the movable selection square when assigning icons.</p>${isAdmin()?`<label class="btn" style="cursor:pointer">＋ Upload Icon Sheet<input type="file" accept="image/*" style="display:none" onchange="uploadAtlas(event)"></label>`:''}</div>
 <div class="card"><h2>▦ Icon Atlas Library (${data.atlasPages.length} pages)</h2>
 <div class="field"><label>Icon sheet</label><select onchange="atlasPickerPage=this.value;render()">${data.atlasPages.map(p=>`<option value="${safe(p.id)}" ${p.id===pg.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div>
 <img src="${atlasSource(pg.id)}" alt="${safe(pg.name)}" style="display:block;width:100%;max-width:700px;margin:auto;border-radius:8px;background:#20162f"/>
 ${isAdmin()&&!pg.builtin?`<div class="row wrap" style="margin-top:12px"><button class="btn2" onclick="renameAtlas('${pg.id}')">Rename Page</button><button class="btn2" onclick="deleteAtlas('${pg.id}')">Delete Page</button></div>`:''}
 </div><div class="card section"><h2>How to select icons</h2><p class="muted tiny">In Tasks, Coupons or Goals choose an atlas icon. Tap or drag the gold square over the image, adjust its size and confirm. Uploaded sheets can have any icon arrangement. All built-in sheets are transparent and grid-free.</p></div>`;
};

<script>

function oqNormalize(payload){

 const defaults=seed();
 if(!Array.isArray(x.atlasPages))x.atlasPages=structuredClone(defaults.atlasPages||[]);

 }

 if(!x.categories.length)x.categories=defaults.categories;
 x.current=oqIdentity();
 x.loginClaims=Array.isArray(x.loginClaims)?x.loginClaims:[];
 x.settings=(x.settings&&typeof x.settings==='object'&&!Array.isArray(x.settings))?x.settings:{};
 for(const [k,v] of Object.entries(defaults.settings))x.settings[k]??=v;
 x.settings.loginXP??=15;x.settings.loginCoins??=5;

async function oqLoad(){let {data:rows,error}=await oqClient.from('oq_shared_state').select('payload,revision').eq('id',1).maybeSingle();if(error)throw error;return rows}
async function oqInitialize(){const identity=oqIdentity();if(identity!=='matthew')throw Error('Matthew must sign in first to initialize Our Quest.');let existing=localStorage.getItem(KEY);let initial;
try{initial=existing?JSON.parse(existing):seed()}catch{initial=seed()}
if(!confirm('Create the new shared cloud game?\n\nOK imports this browser\'s current Our Quest data if present. Cancel starts a fresh game.'))initial=seed();
initial.current='matthew';const {error}=await oqClient.rpc('oq_initialize',{new_payload:initial});if(error)throw error;
}
async function oqStart(session){if(oqStarting||oqReady)return;oqStarting=true;oqSession=session;if(!session){oqStarting=false;oqReady=false;window.oqCloudActive=false;oqOverlay();return}let identity=oqIdentity();if(!identity){oqOverlay('This email is not configured as Matthew or Beth in config.js');oqError('Sign in with an invited email address.');oqStarting=false;return}
try{let row=await oqLoad();if(!row){if(identity==='matthew'){await oqInitialize();row=await oqLoad()}else{oqOverlay('Waiting for Matthew to initialize the shared adventure.');oqStarting=false;return}}
if(!row)throw Error('Shared game was not initialized');data=oqNormalize(row.payload);migrate();data.current=identity;oqRevision=row.revision;oqReady=true;window.oqCloudActive=true;window.oqCloudSave=oqQueueSave;

}catch(e){oqOverlay('Could not load your shared adventure');oqError(e.message||String(e));console.error(e);oqReady=false;window.oqCloudActive=false;oqStarting=false}}
function oqQueueSave(){if(!oqReady)return;oqDirty=true;oqStatus('Saving...');if(!oqSaving)setTimeout(oqFlush,350)}
async function oqFlush(){if(!oqReady||oqSaving||!oqDirty)return;oqSaving=true;oqDirty=false;let payload=structuredClone(data);delete payload.current;let expected=oqRevision;
try{let {data:result,error}=await oqClient.rpc('oq_save_state',{expected_revision:expected,new_payload:payload});if(error)throw error;

 if(!window.supabase?.createClient){oqOverlay('Supabase library could not load');oqError('Check your internet connection or content blocker.');return}
 oqClient=window.supabase.createClient(window.OUR_QUEST_CONFIG.url,window.OUR_QUEST_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 oqOverlay();oqClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){oqSession=null;oqReady=false;window.oqCloudActive=false;oqOverlay()}else if(event==='PASSWORD_RECOVERY'){oqSession=session;let pw=prompt('Enter your new password (at least 6 characters):');if(pw&&pw.length>=6)oqClient.auth.updateUser({password:pw}).then(({error})=>alert(error?error.message:'Password updated.'))}else if(event==='SIGNED_IN'||event==='INITIAL_SESSION'){if(session&&!oqReady)setTimeout(()=>oqStart(session),0)}});
 const {data:sessionData}=await oqClient.auth.getSession();if(sessionData.session&&!oqReady)await oqStart(sessionData.session)
}
// Avoid exposing unprotected local-only data after page load; login overlay appears immediately.
oqBoot();
</script>

<script>
/* V2.0.4: reliable atlas launcher and compact task editor. */
(function(){
 const compact=()=>{
  const type=String(window.modal||'').split('|')[0];
  const form=document.querySelector('.modalback:not(#v16CropPicker) form');
  if(!form||!['task','editTask'].includes(type))return;
  const box=form.closest('.modal');if(box)box.classList.add('oq-compact-task');
  const iconBtn=Array.from(form.querySelectorAll('button')).find(b=>b.textContent.includes('Choose from Icon Atlas'));
  if(iconBtn){iconBtn.type='button';iconBtn.setAttribute('data-oq-atlas','true');iconBtn.onclick=function(e){e.preventDefault();e.stopPropagation();try{v16OpenCrop('task')}catch(err){console.error(err);alert('Icon picker error: '+err.message)}};}
 };
 const oldRender=window.render;
 window.render=function(){const out=oldRender.apply(this,arguments);compact();return out};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-oq-atlas]');if(!b)return;e.preventDefault();e.stopPropagation();try{v16OpenCrop('task')}catch(err){console.error(err);alert('Icon picker error: '+err.message)}},true);
 compact();
})();
</script>
</body></html>
