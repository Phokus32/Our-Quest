'use strict';
const KEY='ourquest-stage1-data-v1';const today=()=>localDate(new Date());const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x||0).toLocaleString();const seed=()=>({players:[{id:'matthew',name:'Matthew',icon:'🛡️',xp:0,coins:0},{id:'beth',name:'Beth',icon:'✨',xp:0,coins:0}],current:'matthew',tasks:[{id:uid(),name:'Tidy the kitchen',emoji:'🧹',category:'Home',xp:25,difficulty:'Easy',repeat:true,frequency:'daily',maxPerPeriod:1,owner:'shared'},{id:uid(),name:'Take a walk',emoji:'🌿',category:'Wellness',xp:35,difficulty:'Normal',repeat:true,frequency:'daily',maxPerPeriod:1,owner:'shared'},{id:uid(),name:'Plan a date night',emoji:'💖',category:'Together',xp:60,difficulty:'Hard',repeat:false,frequency:'once',maxPerPeriod:1,owner:'shared'}],logs:[],quests:[],categories:[{name:'Home',emoji:'🏠',frequency:'daily'},{name:'Wellness',emoji:'🌿',frequency:'daily'},{name:'Together',emoji:'💖',frequency:'monthly'}],ledger:[],champions:[],achievements:[],rewards:[{id:uid(),name:'Choose our next movie',emoji:'🎬',price:60,provider:'either',description:'You pick what we watch.'},{id:uid(),name:'Coffee treat',emoji:'☕',price:100,provider:'either',description:'A special coffee run.'},{id:uid(),name:'Dinner at Olive Garden',emoji:'🍝',price:1000,provider:'matthew',description:'Dinner at Olive Garden, subject to provider approval and scheduling.'}],purchases:[],messages:[],goals:[],settings:{coinRate:10,xpCap:500,backdate:7,dailyBonusXP:50,dailyBonusCoins:25,weeklyBonusXP:125,monthlyBonusXP:400,reduceMotion:false},events:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));function migrate(){data.settings??={coinRate:10,xpCap:500,backdate:7};data.categories??=[{name:'Home',emoji:'🏠',frequency:'daily'},{name:'Wellness',emoji:'🌿',frequency:'daily'},{name:'Together',emoji:'💖',frequency:'monthly'}];data.ledger??=[];data.champions??=[];data.achievements??=[];data.settings.dailyBonusXP??=50;data.settings.dailyBonusCoins??=25;data.settings.weeklyBonusXP??=125;data.settings.monthlyBonusXP??=400;data.tasks.forEach(t=>{t.frequency??=(t.repeat?'daily':'once');t.maxPerPeriod??=1});data.quests.forEach(q=>{q.maxPerDay??=1;q.completedCount??=(q.status==='approved'?1:0);q.awarded??=(q.status==='approved');q.history??=[]});data.purchases.forEach(p=>{if(p.status==='used')p.status='fulfilled';p.history??=[]});if(!data.rewards.some(r=>r.name==='Dinner at Olive Garden'))data.rewards.push({id:uid(),name:'Dinner at Olive Garden',emoji:'🍝',price:1000,provider:'matthew',description:'Dinner at Olive Garden, subject to provider approval and scheduling.'});}migrate();save();let page='home',filter='All',modal='',toastTimer;const me=()=>data.players.find(p=>p.id===data.current);const other=()=>data.players.find(p=>p.id!==data.current);const totalXp=p=>p.xp;const level=p=>Math.floor(Math.sqrt(p.xp/100))+1;const levelBase=n=>100*(n-1)**2;const levelNext=p=>levelBase(level(p)+1);const levelPercent=p=>Math.max(0,Math.min(100,100*(p.xp-levelBase(level(p)))/(levelNext(p)-levelBase(level(p)))));const event=(type,detail)=>data.events.unshift({id:uid(),type,detail,actor:me().name,at:new Date().toISOString()});const notify=s=>{document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3000)};const isAdmin=()=>data.current==='matthew';
const datePeriod=(date,frequency)=>{let d=new Date(date+'T12:00:00');if(frequency==='daily')return date;if(frequency==='weekly'){const offset=d.getDay();d.setDate(d.getDate()-offset);return localDate(d)}if(frequency==='monthly')return date.slice(0,7);if(frequency==='quarterly')return date.slice(0,4)+'-Q'+(Math.floor((d.getMonth())/3)+1);if(frequency==='semiannual')return date.slice(0,4)+'-H'+(d.getMonth()<6?'1':'2');if(frequency==='annual')return date.slice(0,4);return 'lifetime'};
const countTask=(t,player=data.current,date=today())=>data.logs.filter(l=>l.taskId===t.id&&l.player===player&&!l.undone&&datePeriod(l.date,t.frequency||'daily')===datePeriod(date,t.frequency||'daily')).length;
const maxTask=t=>Math.max(1,Number(t.maxPerPeriod||1));
const taskAvailable=t=>{let d=new Date(),days=t.days||[];return (!days.length||days.includes(d.getDay()))&&(!t.startHour||d.getHours()>=Number(t.startHour))&&(!t.endHour||d.getHours()<Number(t.endHour))};
const rankName=l=>l>=100?'Mythic':l>=75?'Legend':l>=50?'Guardian':l>=35?'Champion':l>=20?'Knight':l>=10?'Squire':l>=5?'Adventurer':'Wanderer';
function transaction(player,kind,amount,source,detail){data.ledger.unshift({id:uid(),player,kind,amount,source,detail,at:new Date().toISOString()})}
function credit(playerId,xp,source,detail){let p=data.players.find(p=>p.id===playerId);if(!p||!Number.isFinite(xp)||xp<=0)return;let old=p.xp,oldLevel=level(p);p.xp+=xp;let gold=Math.floor(p.xp/data.settings.coinRate)-Math.floor(old/data.settings.coinRate);p.coins+=gold;transaction(playerId,'xp',xp,source,detail);if(gold)transaction(playerId,'gold',gold,source,detail);if(level(p)>oldLevel)notify('✦ Level up! '+p.name+' is now '+rankName(level(p))+' (Level '+level(p)+')');checkAchievements(playerId)}
function debitXP(playerId,xp,source){let p=data.players.find(p=>p.id===playerId);if(!p)return;let old=p.xp;p.xp=Math.max(0,p.xp-xp);let gold=Math.floor(old/data.settings.coinRate)-Math.floor(p.xp/data.settings.coinRate);p.coins-=gold;transaction(playerId,'xp',-xp,source,'Undo completion');if(gold)transaction(playerId,'gold',-gold,source,'Coin correction')}
const achievementRules=[['first','🌟','First Steps',p=>p.xp>0],['five','⚔️','Five Victories',p=>data.logs.filter(l=>l.player===p.id&&!l.undone).length>=5],['ten','🏅','Ten Victories',p=>data.logs.filter(l=>l.player===p.id&&!l.undone).length>=10],['hero','👑','Rising Hero',p=>level(p)>=3],['quest','📜','Quest Keeper',p=>data.quests.some(q=>q.to===p.id&&q.awarded)],['gold','🪙','Treasure Hunter',p=>p.xp>=1000]];
function checkAchievements(playerId){let p=data.players.find(p=>p.id===playerId);if(!p)return;achievementRules.forEach(([id,icon,title,test])=>{if(test(p)&&!data.achievements.some(a=>a.id===id&&a.player===playerId)){data.achievements.push({id,player:playerId,at:new Date().toISOString()});event('achievement',p.name+' unlocked '+title)}})}
const dailyXP=(player,date)=>data.ledger.filter(t=>t.player===player&&t.kind==='xp'&&t.amount>0&&t.at.slice(0,10)===date&&t.source!=='champion').reduce((a,t)=>a+t.amount,0);
function periodKey(date,kind){return datePeriod(date,kind)}
function settleChampions(){let now=new Date();for(let offset=1;offset<=35;offset++){let d=new Date(now);d.setDate(d.getDate()-offset);let date=localDate(d);for(let kind of ['daily','weekly','monthly']){if(kind==='weekly'&&d.getDay()!==0)continue;if(kind==='monthly'&&new Date(d.getFullYear(),d.getMonth()+1,0).getDate()!==d.getDate())continue;let key=periodKey(date,kind);if(data.champions.some(c=>c.kind===kind&&c.key===key))continue;let from=kind==='daily'?date:kind==='weekly'?periodKey(date,'weekly'):date.slice(0,7)+'-01';let scores=data.players.map(p=>({id:p.id,xp:data.ledger.filter(t=>t.player===p.id&&t.kind==='xp'&&t.amount>0&&t.source!=='champion'&&t.at.slice(0,10)>=from&&t.at.slice(0,10)<=date).reduce((a,t)=>a+t.amount,0)}));let max=Math.max(...scores.map(x=>x.xp));let winners=max>0?scores.filter(x=>x.xp===max).map(x=>x.id):[];data.champions.push({id:uid(),kind,key,date,winners,scores});if(winners.length){let bonus=Number(data.settings[kind+'BonusXP']||0),coins=kind==='daily'?Number(data.settings.dailyBonusCoins||0):0;winners.forEach(id=>{if(bonus)credit(id,bonus,'champion',kind+' winner '+key);if(coins){data.players.find(p=>p.id===id).coins+=coins;transaction(id,'gold',coins,'champion',kind+' winner '+key)}})}}}save()}
function award(xp){credit(data.current,xp,'task','Task completion')}
function nav(to){page=to;filter='All';render();window.scrollTo(0,0)}function taskVisible(t){return t.owner==='shared'||t.owner===data.current}function render(){const titles={home:'Your Adventure',tasks:'Quest Journal',quests:'Quest Board',rewards:'Treasure Shop',messages:'Messages',stats:'Adventure Chronicle',goals:'Long-Term Goals',settings:'Settings & Admin',approvals:'Approval Inbox',more:'More Adventures',requests:'XP Requests',photos:'Photo Library',atlas:'Icon Atlas Library'};const tabs=[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Rewards'],['messages','✉','Messages'],['stats','◫','Stats'],['goals','◈','Goals'],['approvals','✓','Approvals'],['settings','⚙','Settings']];document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="assets/our-quest-icon.png"><div><b>Our Quest</b><small>A SHARED ADVENTURE</small></div></div><nav class="nav">${tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><div class="sidefoot">✦ V1.3.0 local preview<br>Local demonstration mode<br><br>Data is saved on this device only. Cloud syncing is not connected.</div></aside><main><header class="top"><div><div class="eyebrow">✧ OUR QUEST · ${safe(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}</div><h1>${titles[page]||'Our Quest'}</h1></div><div class="topright"><span class="chip">🪙 ${num(me().coins)}</span><select class="selectSmall" aria-label="Active demo profile" onchange="switchPlayer(this.value)">${data.players.map(p=>`<option value="${p.id}" ${p.id===data.current?'selected':''}>${p.icon} ${safe(p.name)}</option>`).join('')}</select></div></header><div class="notice">Preview mode: Switching players simulates two accounts on this browser. It is not secure authentication or cross-phone synchronization.</div>${({home:homeView,tasks:tasksView,quests:questsView,rewards:rewardsView,messages:messagesView,stats:statsView,goals:goalsView,settings:settingsView,approvals:approvalsView,more:moreView,requests:requestXPView,photos:photosView,atlas:atlasView}[page]||homeView)()}</main><nav class="bottom">${[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Shop'],['more','☷','More']].map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav></div>${modal?modalView():''}`}
function homeView(){const p=me(),logs=data.logs.filter(l=>l.player===p.id&&l.date===today()&&!l.undone);return `<div class="hero"><div class="card heroMain"><div class="eyebrow">WELCOME BACK, ${safe(p.name.toUpperCase())}</div><div class="heroTitle">Level ${level(p)} ${rankName(level(p))}</div><div class="heroSub">Every little victory is part of your story. Your next chapter starts today.</div><div class="row between" style="margin-top:20px"><span class="tiny">✦ ${num(p.xp)} XP</span><span class="tiny">${num(levelNext(p)-p.xp)} to next level</span></div><div class="bar"><i style="width:${levelPercent(p)}%"></i></div><button class="btn" style="margin-top:14px" onclick="nav('tasks')">✦ Log an Activity</button></div><div class="heroAside"><div class="card"><div class="statLabel">Today's completions</div><div class="stat">${logs.length}</div><span class="green tiny">✦ +${num(logs.reduce((s,l)=>s+l.xp,0))} XP today</span></div><div class="card"><div class="statLabel">Gold coins</div><div class="stat">${num(p.coins)}</div><span class="muted tiny">Spend in Treasure Shop</span></div><div class="card"><div class="statLabel">Active quests</div><div class="stat">${data.quests.filter(q=>q.to===p.id&&q.status==='accepted').length}</div><span class="muted tiny">Adventures awaiting you</span></div><div class="card"><div class="statLabel">Partner's level</div><div class="stat">${level(other())}</div><span class="muted tiny">${safe(other().name)} · ${num(other().xp)} XP</span></div></div></div><div class="grid two"><section class="card"><div class="row between"><h2>✧ Quick Log</h2><button class="btn2 tiny" onclick="nav('tasks')">All Tasks →</button></div>${data.tasks.filter(taskVisible).slice(0,5).map(taskLine).join('')||'<div class="empty">Create your first task.</div>'}</section><section class="card"><div class="row between"><h2>⚔ Your Quest Board</h2><button class="btn2 tiny" onclick="nav('quests')">View Quests →</button></div>${data.quests.filter(q=>q.to===p.id&&q.status!=='appr function questLine(q){let status={pending:'Awaiting response',accepted:'In progress',submitted:'Awaiting approval',approved:'Completed',declined:'Declined',expired:'Expired'}[q.status]||q.status;let count=q.lastCompletedDate===today()?Number(q.completedCount||0):0,max=Number(q.maxPerDay||1);if(q.deadline&&q.deadline<today()&&!['approved','declined'].includes(q.status))status='Overdue';let canRepeat=q.status==='approved'&&(q.lastCompletedDate!==today()||count<max);return `<div class="listline"><div class="row between"><div><b>${safe(q.title)}</b><div class="tiny muted">${safe(q.from===data.current?'Sent to '+other().name:'From '+other().name)} · <span class="gold">${q.xp} XP</span> · ${status} · ${count}/${max} today</div></div><span class="tag">${status}</span></div>${q.description?`<p class="tiny muted">${safe(q.description)}</p>`:''}${q.deadline?`<div class="tiny muted">Due ${safe(q.deadline)}</div>`:''}<div class="row wrap" style="margin-top:8px">${q.to===data.current&&q.status==='pending'?`<button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Accept</button><button class="btn2 tiny" onclick="questAction('${q.id}','declined')">Decline</button>`:''}${q.to===data.current&&q.status==='accepted'?`<button class="btn tiny" onclick="questAction('${q.id}','submitted')">Mark Complete</button>`:''}${q.from===data.current&&q.status==='submitted'?`<button class="btn tiny" onclick="questAction('${q.id}','approved')">Approve +XP</button><button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Request Changes</button>`:''}${q.to===data.current&&canRepeat?`<button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Repeat Quest</button>`:''}</div></div>`}

d"><label>Goal Title</label><input name="title" required maxlength="100"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Target Count</label><input name="target" type="number" min="1" max="100000" value="10" required></div><div class="field"><label>Visibility</label><select name="owner"><option value="shared">Shared</option><option value="${data.current}">Personal</option></select></div>`;return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${head}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="submitModal(event,'${type}','${id}')">${body}<div class="actions"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button type="submit" class="btn">${type==='quest'?'Send Quest':'Save'}</button></div></form></div></div>`}
function submitModal(e,type,id){e.preventDefault();let f=new FormData(e.target),g=k=>String(f.get(k)||'').trim();if(['task','editTask','category','reward'].includes(type)&&!isAdmin())return notify('Admin only');if(type==='category'){let name=g('name');if(!name||data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return notify('Invalid or duplicate category');data.categories.push({name,emoji:g('emoji')||'✨',frequency:g('frequency')});event('category created',name)}if(type==='task'||type==='editTask'){let o={name:g('name'),description:g('description'),emoji:g('emoji')||'✨',category:g('category')||'Home',xp:Number(g('xp')),difficulty:g('difficulty'),owner:g('owner'),frequency:g('frequency'),maxPerPeriod:Number(g('maxPerPeriod'))||1,startHour:g('startHour'),endHour:g('endHour'),days:[0,1,2,3,4,5,6].filter(i=>g('day'+i)==='1')};if(!o.name||o.xp<1||o.xp>data.settings.xpCap)return notify('Invalid task XP or name');if(type==='editTask'){let t=data.tasks.find(t=>t.id===id);if(t)Object.assign(t,o)}else data.tasks.push({id:uid(),...o});event('task',o.name)}if(type==='quest'){let xp=Number(g('xp')),max=Number(g('maxPerDay'));if(!g('title')||xp<1||xp>data.settings.xpCap||max<1||max>20)return notify('Invalid quest settings');data.quests.unshift({id:uid(),title:g('title'),description:g('description'),xp,from:data.current,to:other().id,status:'pending',maxPerDay:max,completedCount:0,awarded:false,deadline:g('deadline'),history:[],created:new Date().toISOString()});event('quest',g('title'))}if(type==='reward'){data.rewards.push({id:uid(),name:g('name'),description:g('description'),emoji:g('emoji')||'🎁',price:Number(g('price')),provider:g('provider')});event('reward',g('name'))}if(type==='goal'){data.goals.push({id:uid(),title:g('title'),description:g('description'),target:Number(g('target')),progress:0,owner:g('owner')});event('goal',g('title'))}modal='';save();render();notify('Saved successfully ✦')}
function categoryDefaultChanged(name){let cat=data.categories.find(c=>c.name===name),sel=document.querySelector('select[name=frequency]');if(cat&&sel)sel.value=cat.frequency}
function removeCategory(name){if(!isAdmin())return;if(data.tasks.some(t=>t.category===name))return notify('Move or reassign tasks before deleting this category');if(!confirm('Delete category '+name+'?'))return;data.categories=data.categories.filter(c=>c.name!==name);save();render()}

function switchPlayer(id){if(data.players.some(p=>p.id===id)){data.current=id;save();render()}}function logTask(id){let t=data.tasks.find(t=>t.id===id);if(!t||!taskVisible(t))return;let count=countTask(t);if(count>=maxTask(t))return notify('Task already completed for this period');if(!taskAvailable(t))return notify('Task unavailable at this time');let l={id:uid(),taskId:id,name:t.name,player:data.current,date:today(),xp:t.xp,at:new Date().toISOString()};data.logs.push(l);credit(data.current,t.xp,'task',t.name);event('task completed',t.name+' +'+t.xp+' XP');save();render();notify('✦ +'+t.xp+' XP earned!')}
function undoLog(id){let l=data.logs.find(l=>l.id===id);if(!l||l.player!==data.current||l.undone)return;let recent=Date.now()-new Date(l.at||l.date+'T12:00:00').getTime();if(recent>24*3600*1000)return notify('Undo available for 24 hours');if(!confirm('Undo this task completion and reverse XP/coins?'))return;l.undone=true;debitXP(l.player,l.xp,'undo');event('undo',l.name);save();render()}

function questAction(id,status){let q=data.quests.find(q=>q.id===id);if(!q)return;let previous=q.status;if(previous==='approved'&&status==='accepted'){if(q.to!==data.current||(q.lastCompletedDate===today()&&q.completedCount>=q.maxPerDay))return; if(q.lastCompletedDate!==today())q.completedCount=0;q.status='accepted';q.awarded=false}else{const allowed={pending:['accepted','declined'],accepted:['submitted'],submitted:['approved','accepted']};if(!allowed[previous]?.includes(status))return;if(previous==='pending'&&q.to!==data.current)return;if(previous==='accepted'&&q.to!==data.current)return;if(previous==='submitted'&&q.from!==data.current)return;q.status=status}q.history??=[];q.history.push({action:status,actor:data.current,at:new Date().toISOString()});if(status==='approved'&&previous==='submitted'){if(q.awarded)return;q.awarded=true;q.completedCount=(q.lastCompletedDate===today()?Number(q.completedCount||0):0)+1;q.lastCompletedDate=today();credit(q.to,q.xp,'quest',q.title);event('quest approved',q.title+' → '+q.to+' +'+q.xp+' XP')}else event('quest '+status,q.title);save();render();notify(status==='approved'?'Quest approved: '+q.xp+' XP awarded to '+data.players.find(p=>p.id===q.to)?.name:'Quest updated!')}

function buyReward(id){let r=data.rewards.find(r=>r.id===id);if(!r||me().coins<r.price)return notify('Not enough coins');if(!confirm(`Spend ${r.price} gold on ${r.name}?`))return;me().coins-=r.price;transaction(data.current,'gold',-r.price,'coupon',r.name);data.purchases.unshift({id:uid(),rewardId:id,buyer:data.current,provider:r.provider==='either'?other().id:r.provider,status:'active',price:r.price,purchasedAt:new Date().toISOString(),history:[{action:'purchased',at:new Date().toISOString()}]});event('coupon purchased',r.name);save();render();notify('Coupon added to your wallet!')}
function redeem(id){let p=data.purchases.find(p=>p.id===id);if(!p||p.buyer!==data.current||p.status!=='active')return;if(!confirm('Request redemption? The provider must confirm fulfillment.'))return;p.status='requested';p.redeemedAt=new Date().toISOString();p.history.push({action:'requested',at:p.redeemedAt});event('coupon redemption requested',data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon');save();render()}
function fulfillCoupon(id){let p=data.purchases.find(p=>p.id===id);if(!p||p.provider!==data.current||p.status!=='requested')return;p.status='fulfilled';p.fulfilledAt=new Date().toISOString();p.history.push({action:'fulfilled',at:p.fulfilledAt});event('coupon fulfilled',data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon');save();render()}

function sendMessage(e){e.preventDefault();let f=new FormData(e.target),s=String(f.get('text')||'').trim();if(!s)return;data.messages.push({id:uid(),from:data.current,to:other().id,text:s,at:new Date().toISOString()});save();render()}function goalProgress(id){let g=data.goals.find(g=>g.id===id);if(!g||g.progress>=g.target)return;g.progress++;event('goal progress',g.title);save();render()}function saveSettings(){if(!isAdmin())return;let keys=['coinRate','xpCap','backdate','dailyBonusXP','dailyBonusCoins','weeklyBonusXP','monthlyBonusXP'];let values=Object.fromEntries(keys.map(k=>[k,Number(document.getElementById(k).value)]));if(keys.some(k=>!Number.isFinite(values[k])||values[k]<0)||values.coinRate<1||values.xpCap<1)return notify('Please enter valid settings');Object.assign(data.settings,values);event('settings','Economy rules updated');save();render();notify('Settings saved')}
function exportData(){let blob=new Blob([JSON.stringify({app:'Our Quest',version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='our-quest-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let o=JSON.parse(await file.text());if(o.app!=='Our Quest'||!Array.isArray(o.data?.players)||!Array.isArray(o.data?.tasks))throw Error('Invalid backup');if(!confirm('Replace all local Our Quest data with this backup?'))return;data=o.data;migrate();ensureV12();save();render();notify('Backup restored')}catch(err){notify('Unable to restore: '+err.message)}}

function photoHtml(src,cls='proofImg'){return src?`<img class="${cls}" src="${safe(src)}" loading="lazy" alt="Attached photo">`:''}
function galleryHtml(images){return (images||[]).length?`<div class="photoGallery">${images.map(x=>photoHtml(x)).join('')}</div>`:''}
async function compressImage(file){if(!file.type.startsWith('image/'))throw Error('Please select an image');if(file.size>15*1024*1024)throw Error('Image exceeds 15 MB');let blob=await createImageBitmap(file);let scale=Math.min(1,1000/Math.max(blob.width,blob.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(blob.width*scale));canvas.height=Math.max(1,Math.round(blob.height*scale));canvas.getContext('2d').drawImage(blob,0,0,canvas.width,canvas.height);blob.close?.();return canvas.toDataURL('image/jpeg',0.65)}
async function photoSelected(input,kind){let files=[...input.files];if(!files.length)return;let target=kind==='message'?'message':kind;try{let images=[];for(let file of files.slice(0,5)){images.push(await compressImage(file))}if(target==='message'){messagePhoto=images[0];}else{if(photoDraftType!==target){photoDraft=[];photoDraftType=target}photoDraft=[...photoDraft,...images].slice(0,5)}let preview=document.getElementById(target==='message'?'messagePhotoPreview':'photoDraftPreview');if(preview)preview.innerHTML=galleryHtml(target==='message'?[messagePhoto]:photoDraft);notify(images.length+' photo(s) ready. Save or send to attach.')}catch(e){notify('Photo failed: '+e.message)}input.value=''}

function submitXPRequest(e){e.preventDefault();let f=new FormData(e.target),title=String(f.get('title')||'').trim(),xp=Number(f.get('xp'));if(!title||xp<1||xp>data.settings.xpCap)return notify('Invalid request');data.xpRequests.unshift({id:uid(),title,description:String(f.get('description')||'').trim(),xp,requestedXP:xp,from:data.current,to:other().id,status:'pending',private:f.get('private')==='1',photos:[...photoDraft],history:[{action:'submitted',by:data.current,at:new Date().toISOString()}],created:new Date().toISOString(),awarded:false});event('XP request',title);photoDraft=[];modal='';save();render();notify('XP request sent to '+other().name)}
function xpRequestLine(r){let mine=r.from===data.current,reviewer=r.to===data.current;return `<div class="listline"><div class="row between"><b>${safe(r.title)}</b><span class="tag">${safe(r.status)}</span></div><p class="tiny muted">${safe(r.description)} · Requested <span class="gold">${num(r.requestedXP)} XP</span>${r.xp!==r.requestedXP?' · Proposed '+num(r.xp)+' XP':''}</p>${galleryHtml(r.photos)}<div class="tiny muted">${safe(data.players.find(p=>p.id===r.from)?.name)} → ${safe(data.players.find(p=>p.id===r.to)?.name)}</div>${r.history.filter(h=>h.message).slice(-3).map(h=>`<div class="tiny muted">${safe(data.players.find(p=>p.id===h.by)?.name||h.by)}: ${safe(h.message)}</div>`).join('')}<div class="row wrap" style="margin-top:10px">${reviewer&&['pending','responded','counter_accepted'].includes(r.status)?`<button class="btn tiny" onclick="xpRequestAction('${r.id}','approve')">Approve +${r.xp} XP</button><button class="btn2 tiny" onclick="xpRequestAction('${r.id}','question')">Ask Question</button><button class="btn2 tiny" onclick="xpRequestAction('${r.id}','counter')">Counteroffer</button><button class="btn2 tiny" onclick="xpRequestAction('${r.id}','decline')">Decline</button>`:''}${mine&&r.status==='countered'?`<button class="btn tiny" onclick="xpRequestAction('${r.id}','accept_counter')">Accept ${r.xp} XP</button><button class="btn2 tiny" onclick="xpRequestAction('${r.id}','decline')">Decline</button>`:''}${mine&&r.status==='questioned'?`<button class="btn tiny" onclick="xpRequestAction('${r.id}','reply')">Reply</button>`:''}</div></div>`}
function xpRequestAction(id,action){let r=data.xpRequests.find(x=>x.id===id);if(!r)return;let mine=r.from===data.current,reviewer=r.to===data.current;if(action==='approve'){if(!reviewer||r.awarded||!['pending','responded','counter_accepted'].includes(r.status))return;r.awarded=true;r.status='approved';credit(r.from,r.xp,'xp_request',r.title);event('XP request approved',r.private?'Private activity':r.title)}else if(action==='decline'){if(!(reviewer||mine)||['approved','declined'].includes(r.status))return;r.status='declined'}else if(action==='counter'){if(!reviewer||!['pending','responded'].includes(r.status))return;let value=prompt('Propose XP amount',r.xp);if(value===null)return;let n=Number(value);if(!Number.isInteger(n)||n<1||n>data.settings.xpCap)return notify('Invalid XP amount');r.xp=n;r.status='countered'}else if(action==='accept_counter'){if(!mine||r.status!=='countered')return;r.status='counter_accepted'}else if(action==='question'){if(!reviewer||!['pending','responded'].includes(r.status))return;let msg=prompt('Question for '+other().name);if(!msg?.trim())return;r.status='questioned';r.history.push({action:'question',message:msg.trim(),by:data.current,at:new Date().toISOString()})}else if(action==='reply'){if(!mine||r.status!=='questioned')return;let msg=prompt('Reply to question');if(!msg?.trim())return;r.status='responded';r.history.push({action:'reply',message:msg.trim(),by:data.current,at:new Date().toISOString()})}else return;r.history.push({action,by:data.current,at:new Date().toISOString()});save();render();notify('Request updated')}

 {id:'d1',label:'1× a day',frequency:'daily',max:1},{id:'d2',label:'2× a day',frequency:'daily',max:2},

function atlasPickerHtml(){let page=data.atlasPages.find(p=>p.id===atlasPickerPage)||data.atlasPages[0];if(!page)return '';return `<div class="modalback atlas-pick-modal" id="atlasPicker" onclick="if(event.target===this)closeAtlasPicker()"><div class="modal"><div class="row between"><h2>▦ Choose an Icon</h2><button class="iconbtn" onclick="closeAtlasPicker()">✕</button></div><p class="tiny muted">Each square selects exactly one icon from the original sheet. No individual icon files are created.</p><div class="field"><label>Atlas page</label><select onchange="atlasPickerPage=this.value;refreshAtlasPicker()">${data.atlasPages.map(p=>`<option value="${p.id}" ${page.id===p.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div>${atlasGrid(page.id)}<div class="row between" style="margin-top:14px"><span class="tiny muted">${pendingAtlas?'Selected: page '+(atlasPageIndex(pendingAtlas.page)+1)+', icon '+(pendingAtlas.cell+1):'Select a square to assign it'}</span><button class="btn2" onclick="closeAtlasPicker()">Done</button></div></div></div>`}

function atlasView(){return `<div class="row between wrap"><p class="muted">100 selectable icons per page. Task icons reference the original sheet without duplicating image files.</p>${isAdmin()?`<label class="btn" style="cursor:pointer">＋ Upload 10×10 Sheet<input type="file" accept="image/png,image/webp,image/jpeg" style="display:none" onchange="uploadAtlas(event)"></label>`:''}</div><div class="card"><h2>▦ Atlas Pages (${data.atlasPages.length})</h2><div class="field"><label>Choose page</label><select onchange="atlasPickerPage=this.value;render()">${data.atlasPages.map(p=>`<option value="${p.id}" ${atlasPickerPage===p.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></div>${(()=>{let pg=data.atlasPages.find(p=>p.id===atlasPickerPage)||data.atlasPages[0];return `<div class="row between wrap" style="margin-bottom:10px"><b>${safe(pg.name)}</b><span class="tiny muted">Page ${atlasPageIndex(pg.id)+1} of ${data.atlasPages.length} · 100 icons</span></div>${atlasGrid(pg.id,false)}${isAdmin()&&!pg.builtin?`<div class="row wrap" style="margin-top:12px"><button class="btn2" onclick="renameAtlas('${pg.id}')">Rename Page</button><button class="btn2" onclick="deleteAtlas('${pg.id}')">Delete Page</button></div>`:''}`})()}</div><div class="card section"><h2>How to use</h2><p class="muted tiny">As Matthew, open Tasks → Create/Edit Task → Choose from Icon Atlas. Select a square and save. New sheets must be square and contain 10 evenly spaced rows and columns. Uploaded pages stay on this browser until a cloud backend is connected.</p></div>`}
function openAtlasDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('our-quest-icon-atlases',1);r.onupgradeneeded=()=>r.result.createObjectStore('pages');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function atlasStore(id,blob){let db=await openAtlasDB();return new Promise((resolve,reject)=>{let tx=db.transaction('pages','readwrite');tx.objectStore('pages').put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
async function atlasDelete(id){let db=await openAtlasDB();return new Promise((resolve,reject)=>{let tx=db.transaction('pages','readwrite');tx.objectStore('pages').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
async function loadAtlasPages(){try{let db=await openAtlasDB();for(let p of data.atlasPages.filter(p=>!p.builtin)){let blob=await new Promise((resolve,reject)=>{let tx=db.transaction('pages','readonly'),r=tx.objectStore('pages').get(p.id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(blob)atlasSources[p.id]=URL.createObjectURL(blob)}db.close();if(page==='atlas')render()}catch(e){console.warn('Atlas storage unavailable',e)}}
async function uploadAtlas(e){if(!isAdmin())return;let file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return notify('Choose an image');try{let bmp=await createImageBitmap(file);if(Math.abs(bmp.width-bmp.height)>Math.max(bmp.width,bmp.height)*.07){bmp.close();return notify('Atlas must be square (10×10 uniform cells).')}let size=Math.min(1600,Math.max(bmp.width,bmp.height));let c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(bmp,0,0,size,size);bmp.close();let blob=await new Promise(r=>c.toBlob(r,'image/webp',.88));if(!blob)throw Error('Could not encode image');let name=prompt('Name this icon page',file.name.replace(/\.[^.]+$/,''));if(name===null)return;let id=uid();await atlasStore(id,blob);atlasSources[id]=URL.createObjectURL(blob);data.atlasPages.push({id,name:name.trim()||'New Icon Page',builtin:false});atlasPickerPage=id;save();render();notify('100-icon atlas page added')}catch(err){notify('Atlas upload failed: '+err.message)}}
function renameAtlas(id){if(!isAdmin())return;let p=data.atlasPages.find(p=>p.id===id);if(!p)return;let name=prompt('Atlas page name',p.name);if(!name?.trim())return;p.name=name.trim();save();render()}
async function deleteAtlas(id){if(!isAdmin())return;let p=data.atlasPages.find(p=>p.id===id);if(!p||p.builtin)return;if(data.tasks.some(t=>t.atlas?.page===id))return notify('This page is used by a task. Reassign its icon first.');if(!confirm('Delete this atlas page?'))return;data.atlasPages=data.atlasPages.filter(p=>p.id!==id);await atlasDelete(id);if(atlasSources[id]?.startsWith('blob:'))URL.revokeObjectURL(atlasSources[id]);delete atlasSources[id];atlasPickerPage=data.atlasPages[0].id;save();render()}

submitModal=function(e,type,id){if(type==='goal'&&new FormData(e.target).get('goalType')==='weight'){e.preventDefault();let f=new FormData(e.target),start=Number(f.get('startWeight')),target=Number(f.get('targetWeight')),title=String(f.get('title')||'').trim();if(!title||!start||!target||start<=target||target<=0)return notify('Enter a valid starting weight above the target weight');data.goals.push({id:uid(),title,description:String(f.get('description')||''),goalType:'weight',startWeight:start,currentWeight:start,targetWeight:target,milestoneReward:String(f.get('milestoneReward')||''),owner:String(f.get('owner')||data.current),weightHistory:[{at:new Date().toISOString(),weight:start}]});modal='';save();render();notify('Weight goal created');return}v13GoalSubmit(e,type,id)};
const v13GoalsView=goalsView;
goalsView=function(){let allGoals=data.goals;data.goals=allGoals.filter(g=>g.goalType!=='weight');let out;try{out=v13GoalsView()}finally{data.goals=allGoals}for(let g of data.goals.filter(g=>g.goalType==='weight'&&(g.owner==='shared'||g.owner===data.current))){let progress=Math.min(100,Math.max(0,((g.startWeight-g.currentWeight)/(g.startWeight-g.targetWeight))*100));let fragment=`<div class="card"><h2>◈ ${safe(g.title)}</h2><p class="muted tiny">${safe(g.description||'')}</p><div class="row between"><b>${g.currentWeight} lb</b><span class="gold">Target: ${g.targetWeight} lb</span></div><div class="bar"><i style="width:${progress}%"></i></div><div class="weight-progress">${progress.toFixed(1)}% toward target · ${Math.max(0,g.currentWeight-g.targetWeight).toFixed(1)} lb remaining</div>${g.milestoneReward?`<p class="gold tiny">🏆 Milestone reward: ${safe(g.milestoneReward)}</p>`:''}<button class="btn2" onclick="updateWeight('${g.id}')">Update Weight</button></div>`;out=out.replace(/<div class="grid two">/,`<div class="grid two">${fragment}`)}return out};
function updateWeight(id){let g=data.goals.find(g=>g.id===id);if(!g||g.goalType!=='weight'||(g.owner!=='shared'&&g.owner!==data.current))return;let value=prompt('Current weight (lb)',g.currentWeight);if(value===null)return;let weight=Number(value);if(!Number.isFinite(weight)||weight<1||weight>2000)return notify('Invalid weight');g.currentWeight=weight;g.weightHistory??=[];g.weightHistory.push({at:new Date().toISOString(),weight});save();render();notify('Progress updated')}
// Add navigation to icon atlas for admin on task library too.
const v13TasksView=tasksView;
tasksView=function(){let out=v13TasksView();return isAdmin()?out.replace('⚙ Categories</button>',`⚙ Categories</button><button class="btn2" onclick="nav('atlas')">▦ Icon Atlas</button>`):out};
loadAtlasPages();save();

settleChampions();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
