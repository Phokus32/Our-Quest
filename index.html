@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#0e0a1b;--panel:#1b1430;--panel2:#241a3b;--line:#45335d;--text:#f9f2ff;--muted:#ac9dbd;--gold:#f5c77d;--purple:#b77cff;--pink:#ef8acb;--green:#71d8ae;--red:#ff8d9e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 65% -20%,#45205d 0%,transparent 48%),radial-gradient(ellipse at 0% 50%,#221439 0%,transparent 55%),var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}h1,h2,h3,.serif{font-family:Cinzel,Georgia,serif}h1{font-size:28px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.app{max-width:1250px;margin:auto;display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 14px;background:#110d20b8;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;margin:0 5px 30px}.brand img{width:51px;height:51px;border-radius:13px;object-fit:cover}.brand b{font:700 21px Cinzel;color:var(--gold)}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:2px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;text-align:left;padding:13px 14px;border-radius:12px;color:#c5b9d6;background:transparent;font-weight:700}.nav button.active{background:linear-gradient(90deg,#59337d,#312145);color:white;border:1px solid #6d4994}.nav button:hover{background:#332248}.nav button span{margin-right:12px}.sidefoot{margin-top:32px;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--muted)}main{padding:28px 30px 105px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:800;margin-bottom:6px}.muted{color:var(--muted)}.tiny{font-size:12px}.topright{display:flex;gap:8px;align-items:center}.chip,.btn,.btn2,.iconbtn{border:1px solid var(--line);border-radius:11px;background:#2a1e40;color:var(--text);padding:10px 14px;font-weight:800}.btn{background:linear-gradient(125deg,#8a48bf,#57318d);border-color:#a05ad6;box-shadow:0 5px 20px #51277845}.btn2{background:#271b3c}.btn:hover,.btn2:hover,.iconbtn:hover{filter:brightness(1.15)}.iconbtn{padding:9px 11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,#211733e8,#181229e8);border:1px solid #48345f;border-radius:18px;padding:19px;box-shadow:0 8px 35px #00000024}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-bottom:16px}.heroMain{background:linear-gradient(115deg,#32204e,#211634 70%);position:relative;overflow:hidden;min-height:210px}.heroMain:after{content:'✦';position:absolute;right:24px;top:0;color:#a46fd3;font-size:165px;opacity:.14;pointer-events:none}.heroTitle{font:700 30px Cinzel;color:var(--gold);margin:12px 0 8px}.heroSub{color:#d1bfdc;font-size:13px;max-width:340px}.bar{height:9px;background:#3a2b4e;border-radius:50px;overflow:hidden;margin:11px 0 5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#a65aff,#f5be87);border-radius:50px}.stat{font-size:26px;font-weight:800;color:var(--gold);margin:5px 0}.statLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.section{margin-top:22px}.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #382b4a}.task:last-child{border:0}.taskIcon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#3a2854;font-size:23px;flex-shrink:0;overflow:hidden}.taskIcon img{width:100%;height:100%;object-fit:cover}.taskName{font-weight:800;font-size:14px}.tag{display:inline-block;font-size:10px;padding:4px 8px;border-radius:30px;background:#422c5c;color:#e7c8ff;font-weight:800}.gold{color:var(--gold)}.green{color:var(--green)}.pink{color:var(--pink)}.danger{color:var(--red)}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #514064;border-radius:13px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#241a36;color:#d6c7e4;border-radius:9px;padding:9px 13px}.tabs button.active{background:#6a3b95;color:white}.modalback{position:fixed;inset:0;background:#080410d9;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#20152f;border:1px solid #8054a0;border-radius:19px;width:min(510px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 15px 70px #0009}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:12px;color:#d8c5e9;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #59416c;background:#120d20;color:#fff;border-radius:9px;padding:11px;outline:0}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;bottom:90px;right:20px;z-index:100;background:#36204f;border:1px solid var(--gold);border-radius:13px;padding:13px 18px;box-shadow:0 5px 25px #0007;font-size:13px}.bottom{display:none}.heroAside{display:grid;grid-template-columns:1fr 1fr;gap:12px}.divider{border:0;border-top:1px solid #49345e;margin:15px 0}.listline{padding:11px 0;border-bottom:1px solid #3a2b4b}.listline:last-child{border:0}.right{text-align:right}.hide{display:none!important}.selectSmall{background:#291d40;border:1px solid var(--line);border-radius:10px;padding:9px;color:white;max-width:100%}.meter{font-size:11px;color:var(--muted)}.badge{padding:4px 9px;border:1px solid #72518c;border-radius:30px;font-size:11px}.logoLarge{width:100px;height:100px;object-fit:cover;border-radius:22px;border:1px solid #b981d1}.spark{color:var(--gold)}.notice{padding:12px 14px;border-radius:10px;background:#382342;border:1px solid #6e3d73;color:#f4d9ff;font-size:12px;margin-bottom:15px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:920px){.app{grid-template-columns:1fr}.side{display:none}main{padding:20px 15px 100px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;gap:3px;background:#160e28f5;border-top:1px solid #574070;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#bcaacb;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:3px;padding:5px 8px}.bottom button.active{color:var(--gold)}.bottom button span{font-size:19px}.top{align-items:flex-start}.topright{flex-wrap:wrap;justify-content:flex-end}.hero{grid-template-columns:1fr}.heroAside{grid-template-columns:repeat(2,1fr)}}@media(max-width:590px){.grid,.grid.two{grid-template-columns:1fr}.heroAside{grid-template-columns:1fr 1fr}.heroTitle{font-size:26px}.card{padding:15px}.top h1{font-size:23px}.stat{font-size:22px}.topright .chip{display:none}.formGrid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div><script>
'use strict';
const KEY='ourquest-stage1-data-v1';const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x||0).toLocaleString();const seed=()=>({players:[{id:'matthew',name:'Matthew',icon:'🛡️',xp:0,coins:0},{id:'beth',name:'Beth',icon:'✨',xp:0,coins:0}],current:'matthew',tasks:[{id:uid(),name:'Tidy the kitchen',emoji:'🧹',category:'Home',xp:25,difficulty:'Easy',repeat:true,owner:'shared'},{id:uid(),name:'Take a walk',emoji:'🌿',category:'Wellness',xp:35,difficulty:'Normal',repeat:true,owner:'shared'},{id:uid(),name:'Plan a date night',emoji:'💖',category:'Together',xp:60,difficulty:'Hard',repeat:false,owner:'shared'}],logs:[],quests:[],rewards:[{id:uid(),name:'Choose our next movie',emoji:'🎬',price:60,provider:'either',description:'You pick what we watch.'},{id:uid(),name:'Coffee treat',emoji:'☕',price:100,provider:'either',description:'A special coffee run.'}],purchases:[],messages:[],goals:[],settings:{coinRate:10,xpCap:500,backdate:7,reduceMotion:false},events:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));save();let page='home',filter='All',modal='',toastTimer;const me=()=>data.players.find(p=>p.id===data.current);const other=()=>data.players.find(p=>p.id!==data.current);const totalXp=p=>p.xp;const level=p=>Math.floor(Math.sqrt(p.xp/100))+1;const levelBase=n=>100*(n-1)**2;const levelNext=p=>levelBase(level(p)+1);const levelPercent=p=>Math.max(0,Math.min(100,100*(p.xp-levelBase(level(p)))/(levelNext(p)-levelBase(level(p)))));const event=(type,detail)=>data.events.unshift({id:uid(),type,detail,actor:me().name,at:new Date().toISOString()});const notify=s=>{document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3000)};function award(xp){let p=me(),before=p.xp;p.xp+=xp;p.coins+=Math.floor(p.xp/data.settings.coinRate)-Math.floor(before/data.settings.coinRate)}function nav(to){page=to;filter='All';render();window.scrollTo(0,0)}function taskVisible(t){return t.owner==='shared'||t.owner===data.current}function render(){const titles={home:'Your Adventure',tasks:'Quest Journal',quests:'Quest Board',rewards:'Treasure Shop',messages:'Messages',stats:'Adventure Chronicle',goals:'Long-Term Goals',settings:'Settings & Admin',more:'More Adventures'};const tabs=[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Rewards'],['messages','✉','Messages'],['stats','◫','Stats'],['goals','◈','Goals'],['settings','⚙','Settings']];document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="assets/our-quest-icon.png"><div><b>Our Quest</b><small>A SHARED ADVENTURE</small></div></div><nav class="nav">${tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav><div class="sidefoot">✦ Stage 1 build<br>Local demonstration mode<br><br>Data is saved on this device only. Cloud syncing is not connected.</div></aside><main><header class="top"><div><div class="eyebrow">✧ OUR QUEST · ${safe(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}</div><h1>${titles[page]||'Our Quest'}</h1></div><div class="topright"><span class="chip">🪙 ${num(me().coins)}</span><select class="selectSmall" aria-label="Active demo profile" onchange="switchPlayer(this.value)">${data.players.map(p=>`<option value="${p.id}" ${p.id===data.current?'selected':''}>${p.icon} ${safe(p.name)}</option>`).join('')}</select></div></header><div class="notice">Preview mode: Switching players simulates two accounts on this browser. It is not secure authentication or cross-phone synchronization.</div>${({home:homeView,tasks:tasksView,quests:questsView,rewards:rewardsView,messages:messagesView,stats:statsView,goals:goalsView,settings:settingsView,more:moreView}[page]||homeView)()}</main><nav class="bottom">${[['home','⌂','Home'],['tasks','✓','Tasks'],['quests','⚔','Quests'],['rewards','♛','Shop'],['more','☷','More']].map(t=>`<button class="${page===t[0]?'active':''}" onclick="nav('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav></div>${modal?modalView():''}`}
function homeView(){const p=me(),logs=data.logs.filter(l=>l.player===p.id&&l.date===today());return `<div class="hero"><div class="card heroMain"><div class="eyebrow">WELCOME BACK, ${safe(p.name.toUpperCase())}</div><div class="heroTitle">Level ${level(p)} Adventurer</div><div class="heroSub">Every little victory is part of your story. Your next chapter starts today.</div><div class="row between" style="margin-top:20px"><span class="tiny">✦ ${num(p.xp)} XP</span><span class="tiny">${num(levelNext(p)-p.xp)} to next level</span></div><div class="bar"><i style="width:${levelPercent(p)}%"></i></div><button class="btn" style="margin-top:14px" onclick="nav('tasks')">✦ Log an Activity</button></div><div class="heroAside"><div class="card"><div class="statLabel">Today's completions</div><div class="stat">${logs.length}</div><span class="green tiny">✦ +${num(logs.reduce((s,l)=>s+l.xp,0))} XP today</span></div><div class="card"><div class="statLabel">Gold coins</div><div class="stat">${num(p.coins)}</div><span class="muted tiny">Spend in Treasure Shop</span></div><div class="card"><div class="statLabel">Active quests</div><div class="stat">${data.quests.filter(q=>q.to===p.id&&q.status==='accepted').length}</div><span class="muted tiny">Adventures awaiting you</span></div><div class="card"><div class="statLabel">Partner's level</div><div class="stat">${level(other())}</div><span class="muted tiny">${safe(other().name)} · ${num(other().xp)} XP</span></div></div></div><div class="grid two"><section class="card"><div class="row between"><h2>✧ Quick Log</h2><button class="btn2 tiny" onclick="nav('tasks')">All Tasks →</button></div>${data.tasks.filter(taskVisible).slice(0,5).map(taskLine).join('')||'<div class="empty">Create your first task.</div>'}</section><section class="card"><div class="row between"><h2>⚔ Your Quest Board</h2><button class="btn2 tiny" onclick="nav('quests')">View Quests →</button></div>${data.quests.filter(q=>q.to===p.id&&q.status!=='approved'&&q.status!=='declined').slice(0,4).map(questLine).join('')||'<div class="empty">No quests yet. Send your partner an adventure!</div>'}<hr class="divider"><h3>✉ Latest Message</h3><p class="muted tiny">${data.messages.length?safe(data.messages.at(-1).text):'Your shared story is waiting to be written.'}</p></section></div><section class="section card"><div class="row between"><h2>Recent Achievements</h2><button class="btn2 tiny" onclick="nav('stats')">View History →</button></div><div class="grid">${[['🌟','First Steps',p.xp>0],['⚔️','Getting Started',data.logs.filter(l=>l.player===p.id).length>=5],['👑','Rising Hero',level(p)>=3]].map(([i,n,ok])=>`<div class="card" style="text-align:center;opacity:${ok?1:.45}"><div style="font-size:31px">${i}</div><b>${n}</b><div class="tiny muted">${ok?'Unlocked':'Locked'}</div></div>`).join('')}</div></section>`}
function taskLine(t){let count=data.logs.filter(l=>l.taskId===t.id&&l.player===data.current&&l.date===today()).length;return `<div class="task"><div class="taskIcon">${t.emoji?.startsWith('data:')?`<img src="${t.emoji}">`:safe(t.emoji||'✨')}</div><div style="flex:1;min-width:0"><div class="taskName">${safe(t.name)}</div><div class="tiny muted">${safe(t.category)} · ${safe(t.difficulty||'Normal')} · <span class="gold">+${t.xp} XP</span> ${count?'· Today ×'+count:''}</div></div><button class="iconbtn" title="Log task" onclick="logTask('${t.id}')">+ XP</button></div>`}
function tasksView(){let cats=['All',...new Set(data.tasks.filter(taskVisible).map(t=>t.category))],list=data.tasks.filter(t=>taskVisible(t)&&(filter==='All'||t.category===filter));return `<div class="row between wrap"><p class="muted">Create custom tasks, collect XP and build momentum.</p><button class="btn" onclick="openModal('task')">＋ Create Task</button></div><div class="tabs">${cats.map(c=>`<button class="${filter===c?'active':''}" onclick="filter=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${safe(c)}</button>`).join('')}</div><section class="card">${list.map(t=>`<div class="row between" style="gap:5px"> <div style="flex:1;min-width:0">${taskLine(t)}</div><button class="iconbtn" title="Edit task" onclick="openModal('editTask','${t.id}')">✎</button></div>`).join('')||'<div class="empty">No tasks in this category.</div>'}</section><p class="tiny muted">Tasks and XP are saved locally. Configure cloud accounts in a later development stage.</p>`}
function questLine(q){let status={pending:'Awaiting response',accepted:'In progress',submitted:'Awaiting approval',approved:'Completed',declined:'Declined'}[q.status]||q.status;return `<div class="listline"><div class="row between"><div><b>${safe(q.title)}</b><div class="tiny muted">${safe(q.from===data.current?'Sent to '+other().name:'From '+other().name)} · <span class="gold">${q.xp} XP</span> · ${status}</div></div><span class="tag">${status}</span></div>${q.description?`<p class="tiny muted">${safe(q.description)}</p>`:''}<div class="row wrap" style="margin-top:8px">${q.to===data.current&&q.status==='pending'?`<button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Accept</button><button class="btn2 tiny" onclick="questAction('${q.id}','declined')">Decline</button>`:''}${q.to===data.current&&q.status==='accepted'?`<button class="btn tiny" onclick="questAction('${q.id}','submitted')">Mark Complete</button>`:''}${q.from===data.current&&q.status==='submitted'?`<button class="btn tiny" onclick="questAction('${q.id}','approved')">Approve +XP</button><button class="btn2 tiny" onclick="questAction('${q.id}','accepted')">Request Changes</button>`:''}</div></div>`}
function questsView(){return `<div class="row between wrap"><p class="muted">Send your partner a quest. XP is awarded only after you approve their completion.</p><button class="btn" onclick="openModal('quest')">＋ Send Quest</button></div><div class="grid two"><div class="card"><h2>⚔ Quests for You</h2>${data.quests.filter(q=>q.to===data.current).map(questLine).join('')||'<div class="empty">Your quest board is clear.</div>'}</div><div class="card"><h2>✉ Quests You Sent</h2>${data.quests.filter(q=>q.from===data.current).map(questLine).join('')||'<div class="empty">You haven’t sent a quest yet.</div>'}</div></div>`}
function rewardsView(){return `<div class="row between wrap"><p class="muted">Exchange coins for thoughtful real-world rewards.</p><button class="btn" onclick="openModal('reward')">＋ Create Coupon</button></div><div class="grid">${data.rewards.map(r=>`<div class="card"><div style="font-size:36px">${safe(r.emoji)}</div><h2 style="margin-top:10px">${safe(r.name)}</h2><p class="muted tiny" style="min-height:35px">${safe(r.description)}</p><div class="row between"><b class="gold">🪙 ${num(r.price)}</b><button class="btn" onclick="buyReward('${r.id}')" ${me().coins<r.price?'disabled':''}>Purchase</button></div></div>`).join('')}</div><section class="card section"><h2>🎟 Your Coupon Wallet</h2>${data.purchases.filter(p=>p.buyer===data.current).map(p=>{let r=data.rewards.find(r=>r.id===p.rewardId);return `<div class="listline row between"><div><b>${safe(r?.name||'Archived coupon')}</b><div class="tiny muted">${p.status==='used'?'Redeemed':'Available to redeem'}</div></div>${p.status==='active'?`<button class="btn2" onclick="redeem('${p.id}')">Redeem</button>`:'✓'}</div>`}).join('')||'<div class="empty">Your wallet is empty. Complete tasks to earn coins!</div>'}</section>`}
function messagesView(){return `<div class="card" style="max-width:740px;margin:auto"><div class="row between"><h2>✉ ${safe(other().name)}</h2><span class="tag">Local preview</span></div><div style="min-height:260px;max-height:480px;overflow:auto;padding:12px 0">${data.messages.map(m=>`<div style="display:flex;justify-content:${m.from===data.current?'flex-end':'flex-start'};margin:9px 0"><div style="background:${m.from===data.current?'#59357d':'#332643'};padding:11px 14px;border-radius:14px;max-width:85%;overflow-wrap:anywhere"><div class="tiny gold">${safe(data.players.find(p=>p.id===m.from)?.name||'')}</div>${safe(m.text)}<div class="tiny muted">${new Date(m.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">Say hello to start your conversation.</div>'}</div><form onsubmit="sendMessage(event)" class="row"><input name="text" aria-label="Message" placeholder="Write a message..." maxlength="1000" required style="flex:1;min-width:0;padding:12px;background:#120d20;color:white;border:1px solid #59416c;border-radius:10px"><button class="btn" type="submit">Send ↗</button></form><p class="tiny muted">Messages are only visible on this device in the current stage. They are not sent to your partner's phone.</p></div>`}
function statsView(){let p=me(),logs=data.logs.filter(l=>l.player===p.id);let byDate={};logs.forEach(l=>byDate[l.date]=(byDate[l.date]||0)+l.xp);return `<div class="grid"><div class="card"><div class="statLabel">Lifetime XP</div><div class="stat">${num(p.xp)}</div></div><div class="card"><div class="statLabel">Total Activities</div><div class="stat">${logs.length}</div></div><div class="card"><div class="statLabel">Current Level</div><div class="stat">${level(p)}</div></div></div><div class="grid two section"><div class="card"><h2>✧ Activity by Day</h2>${Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([date,xp])=>`<div class="listline"><div class="row between tiny"><span>${safe(date)}</span><span class="gold">${xp} XP</span></div><div class="bar"><i style="width:${Math.min(100,xp/Math.max(1,...Object.values(byDate))*100)}%"></i></div></div>`).join('')||'<div class="empty">Your progress will appear here.</div>'}</div><div class="card"><h2>⚔ Activity History</h2>${logs.slice().reverse().slice(0,15).map(l=>`<div class="listline row between"><div><b>${safe(l.name)}</b><div class="tiny muted">${safe(l.date)}</div></div><span class="gold">+${l.xp} XP</span></div>`).join('')||'<div class="empty">No activities logged yet.</div>'}<button class="btn2" style="margin-top:14px" onclick="exportData()">↓ Export All Data</button></div></div>`}
function goalsView(){return `<div class="row between wrap"><p class="muted">Build toward something meaningful, one milestone at a time.</p><button class="btn" onclick="openModal('goal')">＋ Create Goal</button></div><div class="grid two">${data.goals.filter(g=>g.owner==='shared'||g.owner===data.current).map(g=>`<div class="card"><div class="row between"><h2>◈ ${safe(g.title)}</h2><span class="tag">${g.owner==='shared'?'Shared':'Personal'}</span></div><p class="muted tiny">${safe(g.description)}</p><div class="row between tiny"><span>Progress</span><b class="gold">${g.progress} / ${g.target}</b></div><div class="bar"><i style="width:${Math.min(100,g.progress/g.target*100)}%"></i></div><button class="btn2" style="margin-top:13px" onclick="goalProgress('${g.id}')" ${g.progress>=g.target?'disabled':''}>＋ Progress</button></div>`).join('')||'<div class="empty">No goals yet. Set your first milestone!</div>'}</div>`}
function moreView(){return `<div class="grid two">${[['messages','✉','Messages'],['stats','◫','Statistics'],['goals','◈','Long-Term Goals'],['settings','⚙','Settings & Admin']].map(([p,i,t])=>`<button class="card" style="color:white;text-align:left;font-weight:800;font-size:17px" onclick="nav('${p}')">${i} ${t} →</button>`).join('')}</div>`}
function settingsView(){return `<div class="grid two"><div class="card"><h2>⚙ Economy Settings</h2><p class="muted tiny">Demo administrator controls. The cloud version will restrict these to Matthew's authenticated admin account.</p><div class="field"><label>XP earned per coin</label><input type="number" min="1" max="1000" id="coinRate" value="${data.settings.coinRate}"></div><div class="field"><label>Maximum XP per task</label><input type="number" min="1" max="100000" id="xpCap" value="${data.settings.xpCap}"></div><div class="field"><label>Backdating window (days)</label><input type="number" min="0" max="365" id="backdate" value="${data.settings.backdate}"></div><button class="btn" onclick="saveSettings()">Save Settings</button></div><div class="card"><h2>♜ Data & Maintenance</h2><p class="muted tiny">Your data is currently stored in this browser. Back up regularly until cloud sync is connected.</p><button class="btn2" onclick="exportData()">↓ Export JSON Backup</button><div class="field"><label>Restore from a JSON backup</label><input type="file" accept=".json,application/json" onchange="importData(event)"></div><hr class="divider"><h3>Activity Audit</h3>${data.events.slice(0,10).map(e=>`<div class="listline tiny">${safe(e.actor)} · ${safe(e.type)}<br><span class="muted">${safe(e.detail)} · ${new Date(e.at).toLocaleString()}</span></div>`).join('')||'<p class="muted tiny">No events yet.</p>'}</div></div><div class="card section"><h2>About This Build</h2><p class="muted">Our Quest V1.0 · Stage 1 interactive foundation. Tasks, local XP, coins, quests, coupon purchases, messaging, goals, stats and exports are usable in a single browser. This is not yet the finished two-device application.</p><span class="tag">No backend connected</span> <span class="tag">Local-first prototype</span> <span class="tag">Installable PWA</span></div>`}
function openModal(type,id=''){modal=type+'|'+id;render()}function closeModal(){modal='';render()}function modalView(){let [type,id]=modal.split('|'),t=data.tasks.find(t=>t.id===id);let head={task:'Create New Task',editTask:'Edit Task',quest:'Send a Quest',reward:'Create a Coupon',goal:'Create a Goal'}[type];let body='';if(type==='task'||type==='editTask')body=`<div class="field"><label>Task Name</label><input name="name" required maxlength="80" value="${safe(t?.name||'')}"></div><div class="formGrid"><div class="field"><label>Icon or Emoji</label><input name="emoji" maxlength="8" value="${safe(t?.emoji||'✨')}"></div><div class="field"><label>Category</label><input name="category" maxlength="40" value="${safe(t?.category||'Home')}"></div><div class="field"><label>XP Reward</label><input name="xp" type="number" min="1" max="${data.settings.xpCap}" required value="${t?.xp||25}"></div><div class="field"><label>Difficulty</label><select name="difficulty">${['Easy','Normal','Hard','Epic','Legendary'].map(d=>`<option ${t?.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select name="owner"><option value="shared" ${t?.owner==='shared'?'selected':''}>Shared</option><option value="${data.current}" ${t?.owner===data.current?'selected':''}>Private to me</option></select></div><div class="field"><label>Repeatable</label><select name="repeat"><option value="yes" ${t?.repeat?'selected':''}>Yes</option><option value="no" ${t&&!t.repeat?'selected':''}>No</option></select></div></div>`;if(type==='quest')body=`<div class="field"><label>Quest Title</label><input name="title" required maxlength="100" placeholder="A noble quest for ${safe(other().name)}"></div><div class="field"><label>Description</label><textarea name="description" maxlength="1000"></textarea></div><div class="field"><label>XP Reward</label><input name="xp" type="number" min="1" max="${data.settings.xpCap}" required value="75"></div>`;if(type==='reward')body=`<div class="field"><label>Coupon Name</label><input name="name" required maxlength="80" placeholder="Dinner date"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="formGrid"><div class="field"><label>Emoji</label><input name="emoji" value="🎁" maxlength="8"></div><div class="field"><label>Coin Price</label><input name="price" type="number" min="1" max="100000" value="100" required></div></div>`;if(type==='goal')body=`<div class="field"><label>Goal Title</label><input name="title" required maxlength="100" placeholder="Walk 30 times"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Target Count</label><input name="target" type="number" min="1" max="100000" value="10" required></div><div class="field"><label>Visibility</label><select name="owner"><option value="shared">Shared</option><option value="${data.current}">Personal</option></select></div>`;return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>${head}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form onsubmit="submitModal(event,'${type}','${id}')">${body}<div class="actions"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button type="submit" class="btn">${type==='quest'?'Send Quest':'Save'}</button></div></form></div></div>`}
function submitModal(e,type,id){e.preventDefault();let f=new FormData(e.target),g=k=>String(f.get(k)||'').trim();if(type==='task'||type==='editTask'){let o={name:g('name'),emoji:g('emoji')||'✨',category:g('category')||'Other',xp:Number(g('xp')),difficulty:g('difficulty'),owner:g('owner'),repeat:g('repeat')==='yes'};if(!o.name||o.xp<1||o.xp>data.settings.xpCap)return notify('Invalid task XP or name');if(type==='editTask'){let t=data.tasks.find(t=>t.id===id);if(t)Object.assign(t,o)}else data.tasks.push({id:uid(),...o});event('task',o.name)}if(type==='quest'){data.quests.unshift({id:uid(),title:g('title'),description:g('description'),xp:Number(g('xp')),from:data.current,to:other().id,status:'pending',created:new Date().toISOString()});event('quest',g('title'))}if(type==='reward'){data.rewards.push({id:uid(),name:g('name'),description:g('description'),emoji:g('emoji')||'🎁',price:Number(g('price')),provider:data.current});event('reward',g('name'))}if(type==='goal'){data.goals.push({id:uid(),title:g('title'),description:g('description'),target:Number(g('target')),progress:0,owner:g('owner')});event('goal',g('title'))}modal='';save();render();notify('Saved successfully ✦')}
function switchPlayer(id){if(data.players.some(p=>p.id===id)){data.current=id;save();render()}}function logTask(id){let t=data.tasks.find(t=>t.id===id);if(!t||!taskVisible(t))return;let todayLogs=data.logs.filter(l=>l.player===data.current&&l.taskId===id);if(!t.repeat&&todayLogs.length)return notify('This task is not repeatable');let l={id:uid(),taskId:id,name:t.name,player:data.current,date:today(),xp:t.xp};data.logs.push(l);award(t.xp);event('task completed',t.name+' +'+t.xp+' XP');save();render();notify('✦ +'+t.xp+' XP earned!')}function questAction(id,status){let q=data.quests.find(q=>q.id===id);if(!q)return;const allowed={pending:['accepted','declined'],accepted:['submitted'],submitted:['approved','accepted']};if(!allowed[q.status]?.includes(status))return;if((status==='approved'||q.status==='submitted')&&q.from!==data.current)return;if(['accepted','declined','submitted'].includes(status)&&q.to!==data.current&&!(q.status==='submitted'&&status==='accepted'))return;q.status=status;if(status==='approved'){let recipient=data.players.find(p=>p.id===q.to);let before=recipient.xp;recipient.xp+=q.xp;recipient.coins+=Math.floor(recipient.xp/data.settings.coinRate)-Math.floor(before/data.settings.coinRate)}event('quest '+status,q.title);save();render();notify('Quest updated!')}function buyReward(id){let r=data.rewards.find(r=>r.id===id);if(!r||me().coins<r.price)return notify('Not enough coins');if(!confirm(`Spend ${r.price} coins on ${r.name}?`))return;me().coins-=r.price;data.purchases.unshift({id:uid(),rewardId:id,buyer:data.current,status:'active'});event('coupon purchased',r.name);save();render();notify('Coupon added to your wallet!')}function redeem(id){let p=data.purchases.find(p=>p.id===id);if(!p||p.buyer!==data.current||p.status!=='active')return;if(!confirm('Mark this coupon redeemed?'))return;p.status='used';event('coupon redeemed',data.rewards.find(r=>r.id===p.rewardId)?.name||'Coupon');save();render()}function sendMessage(e){e.preventDefault();let f=new FormData(e.target),s=String(f.get('text')||'').trim();if(!s)return;data.messages.push({id:uid(),from:data.current,to:other().id,text:s,at:new Date().toISOString()});save();render()}function goalProgress(id){let g=data.goals.find(g=>g.id===id);if(!g||g.progress>=g.target)return;g.progress++;event('goal progress',g.title);save();render()}function saveSettings(){let c=Number(document.getElementById('coinRate').value),x=Number(document.getElementById('xpCap').value),b=Number(document.getElementById('backdate').value);if(c<1||x<1||b<0)return notify('Please enter valid settings');Object.assign(data.settings,{coinRate:c,xpCap:x,backdate:b});event('settings','Economy rules updated');save();render();notify('Settings saved')}function exportData(){let blob=new Blob([JSON.stringify({app:'Our Quest',version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='our-quest-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let file=e.target.files?.[0];if(!file)return;try{let o=JSON.parse(await file.text());if(o.app!=='Our Quest'||!Array.isArray(o.data?.players)||!Array.isArray(o.data?.tasks))throw Error('Invalid backup');if(!confirm('Replace all local Our Quest data with this backup?'))return;data=o.data;save();render();notify('Backup restored')}catch(err){notify('Unable to restore: '+err.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
